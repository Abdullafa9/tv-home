<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة التلفزيون الرئيسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: a fixed 1920x1080 TV stage, scaled to fit any screen.
     Clock and next prayer on the right, matches on the left, prayer strip and apps along the bottom,
     all sitting on a slowly drifting landscape that changes every few minutes. */
  color-scheme: dark;
  --ink: #f7f2e8;
  --ink-dim: rgba(247, 242, 232, .68);
  --glass: rgba(9, 13, 26, .50);
  --glass-line: rgba(247, 242, 232, .14);
  --sun: #f6b756;
  --live: #ff7a66;
  --night: #05070f;
  --font-display: "Reem Kufi", "Noto Kufi Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 16px; overflow: hidden;
}
html.tv body { padding: 0; gap: 0; }

.frame { position: relative; overflow: hidden; border-radius: 10px; direction: ltr; flex: none; }
html.tv .frame { border-radius: 0; }
.stage {
  position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
  transform-origin: 0 0; direction: rtl; overflow: hidden; background: var(--night);
}

/* ---------- scenery ---------- */
.scenery { position: absolute; inset: 0; animation: drift 80s ease-in-out infinite alternate; will-change: transform; }
.scenery canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 2.8s ease; }
.scenery canvas.on { opacity: 1; }
@keyframes drift {
  from { transform: scale(1.03) translate(0.6%, 0.4%); }
  to   { transform: scale(1.11) translate(-1.6%, -1.1%); }
}
.shade {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(to bottom, rgba(5, 8, 18, .62) 0, rgba(5, 8, 18, 0) 30%),
    linear-gradient(to top, rgba(5, 8, 18, .86) 0, rgba(5, 8, 18, .42) 30%, rgba(5, 8, 18, 0) 56%),
    rgba(5, 8, 18, .14);
}

/* ---------- top bar ---------- */
.top { position: absolute; top: 60px; left: 80px; right: 80px; display: flex; justify-content: space-between; align-items: flex-start; }
.date .day { font-family: var(--font-display); font-weight: 700; font-size: 52px; line-height: 1.15; }
.date .full { font-size: 30px; color: var(--ink-dim); margin-top: 4px; }
.weather { display: flex; align-items: center; gap: 22px; direction: rtl; }
.weather svg { width: 84px; height: 84px; flex: none; }
.weather .temp { font-family: var(--font-display); font-weight: 700; font-size: 72px; line-height: 1; }
.weather .cond { font-size: 30px; }
.weather .sub { font-size: 24px; color: var(--ink-dim); margin-top: 4px; }

/* ---------- clock ---------- */
.clock { position: absolute; top: 196px; right: 80px; display: flex; align-items: baseline; gap: 26px; direction: ltr; text-shadow: 0 6px 40px rgba(0, 0, 0, .45); }
.clock .time { font-family: var(--font-display); font-weight: 700; font-size: 290px; line-height: 1; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
.clock .colon { animation: blink 2s steps(1) infinite; }
.clock .ampm { font-family: var(--font-display); font-weight: 500; font-size: 78px; color: var(--ink-dim); }
@keyframes blink { 50% { opacity: .35; } }

.next {
  position: absolute; top: 528px; right: 80px; display: flex; align-items: center; gap: 18px;
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px; padding: 16px 34px 16px 30px;
  font-size: 34px;
}
.next .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--sun); flex: none; }
.next b { font-family: var(--font-display); font-weight: 700; color: var(--sun); }
.next.now { background: var(--sun); color: #1b1305; border-color: transparent; }
.next.now b { color: #1b1305; }
.next.now .dot { background: #1b1305; }

/* ---------- matches ---------- */
.matches { position: absolute; top: 236px; left: 80px; width: 660px; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 26px; padding: 26px 30px 14px; }
.matches h2 { font-family: var(--font-display); font-weight: 700; font-size: 34px; display: flex; justify-content: space-between; align-items: center; }
.tag { font-family: var(--font-body); font-weight: 500; font-size: 20px; color: var(--ink-dim); border: 1px solid var(--glass-line); border-radius: 999px; padding: 4px 14px; }
.match { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 16px 0; border-top: 1px solid var(--glass-line); }
.match:first-of-type { margin-top: 16px; }
.match .teams { font-size: 30px; line-height: 1.3; }
.match .teams b { font-weight: 600; color: var(--sun); }
.match .comp { font-size: 22px; color: var(--ink-dim); margin-top: 2px; }
.match .when { text-align: left; flex: none; font-variant-numeric: tabular-nums; }
.match .when .d { font-size: 22px; color: var(--ink-dim); }
.match .when .t { font-size: 30px; font-weight: 500; }
.match .when .livepill { background: var(--live); color: #230703; font-weight: 600; font-size: 22px; border-radius: 999px; padding: 2px 14px; display: inline-block; }
.empty { font-size: 26px; color: var(--ink-dim); padding: 22px 0 14px; }

/* ---------- prayer strip ---------- */
.prayers { position: absolute; bottom: 192px; left: 80px; right: 80px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
.prayer { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 22px; padding: 18px 26px; display: flex; justify-content: space-between; align-items: center; }
.prayer .name { font-family: var(--font-display); font-weight: 500; font-size: 32px; }
.prayer .at { font-size: 34px; font-weight: 500; font-variant-numeric: tabular-nums; direction: rtl; }
.prayer.past { opacity: .52; }
.prayer.upnext { background: var(--sun); color: #1b1305; border-color: transparent; }
.prayer.upnext .name { font-weight: 700; }

/* ---------- apps ---------- */
.apps { position: absolute; bottom: 60px; left: 80px; right: 80px; display: flex; gap: 14px; }
.app {
  flex: 1; height: 100px; border-radius: 22px; background: var(--glass); border: 1px solid var(--glass-line);
  color: var(--ink); font-family: var(--font-body); font-weight: 500; font-size: 28px; cursor: pointer;
  transition: transform .18s ease, background .18s ease;
}
.app:hover { background: rgba(247, 242, 232, .16); }
.app:focus-visible { outline: 5px solid var(--sun); outline-offset: 3px; transform: scale(1.06); background: rgba(247, 242, 232, .20); }
.app.all { color: var(--ink-dim); }

.toast {
  position: absolute; bottom: 300px; left: 50%; transform: translateX(-50%); background: rgba(9, 13, 26, .92);
  border: 1px solid var(--glass-line); border-radius: 999px; padding: 16px 36px; font-size: 28px; opacity: 0; transition: opacity .3s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* ---------- preview helper (hidden on the TV) ---------- */
.helper { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; max-width: 640px; text-align: center; }
.helper p { font-size: 15px; line-height: 1.7; color: var(--ink-dim); flex: 1 1 100%; }
.helper button {
  font-family: var(--font-body); font-size: 15px; font-weight: 500; color: #1b1305; background: var(--sun);
  border: 0; border-radius: 999px; padding: 10px 20px; cursor: pointer;
}
.helper button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.helper .scene-name { font-size: 15px; color: var(--ink); }
html.tv .helper, html.short .helper { display: none; }

@media (prefers-reduced-motion: reduce) {
  .scenery, .clock .colon { animation: none; }
  .scenery canvas { transition: none; }
}
</style>
</head>
<body>

<div class="frame" id="frame">
  <div class="stage" id="stage">
    <div class="scenery" aria-hidden="true">
      <canvas id="bgA" width="1920" height="1080" class="on"></canvas>
      <canvas id="bgB" width="1920" height="1080"></canvas>
    </div>
    <div class="shade" aria-hidden="true"></div>

    <div class="top">
      <div class="date">
        <div class="day" id="dayName"></div>
        <div class="full" id="fullDate"></div>
      </div>
      <div class="weather" id="weather"></div>
    </div>

    <div class="clock" aria-live="off">
      <span class="ampm" id="ampm"></span>
      <span class="time"><span id="hh"></span><span class="colon">:</span><span id="mm"></span></span>
    </div>

    <div class="next" id="next"><span class="dot"></span><span id="nextText"></span></div>

    <section class="matches" aria-label="المباريات القادمة">
      <h2>المباريات القادمة <span class="tag" id="matchTag" hidden></span></h2>
      <div id="matchList"></div>
    </section>

    <div class="prayers" id="prayers" aria-label="أوقات الصلاة في الرياض"></div>

    <nav class="apps" id="apps" aria-label="التطبيقات"></nav>
    <div class="toast" id="toast" role="status"></div>
  </div>
</div>

<div class="helper" id="helper">
  <p>معاينة بمقاس شاشة التلفزيون. أدر الجوال أفقيًّا لتكبيرها. الخلفية تتبدّل تلقائيًّا كل عشر دقائق.</p>
  <button type="button" id="nextScene">بدّل المنظر</button>
  <span class="scene-name" id="sceneName"></span>
</div>

<script>
'use strict';

/* ================= settings ================= */
const CITY = { name: 'الرياض', lat: 24.7136, lng: 46.6753, tz: 3 };
const SCENE_MINUTES = 10;
const APPS = [
  ['نتفليكس', 'com.netflix.ninja'],
  ['يوتيوب', 'com.google.android.youtube.tv'],
  ['ديزني+', 'com.disney.disneyplus'],
  ['أو إس إن+', 'com.osn.go'],
  ['ثمانية', 'com.thmanyah.shasha.tv'],
  ['آبل تي في', 'com.apple.atve.androidtv.appletv'],
  ['برايم فيديو', 'com.amazon.amazonvideo.livingroom'],
  ['إن بي إيه', 'com.nbaimd.gametime.nba2011'],
  ['كل التطبيقات', 'all'],
];
/* Teams followed: [league path on the scores feed, competition name, team-name test, days ahead to read] */
const FOLLOW = [
  ['soccer/ksa.1', 'دوري روشن', /nassr/i, 14],
  ['soccer/esp.1', 'الدوري الإسباني', /^(fc )?barcelona$/i, 14],
  ['basketball/nba', 'دوري السلة الأمريكي', /76ers/i, 7],
];
/* Fixtures saved on 18 Nov 2026, shown only when the live feed cannot be reached. */
const SAVED_MATCHES = [
  { date: '2026-11-19T00:00:00Z', home: 'Orlando Magic', away: 'Philadelphia 76ers', comp: 'دوري السلة الأمريكي' },
  { date: '2026-11-21T18:00:00Z', home: 'Philadelphia 76ers', away: 'Milwaukee Bucks', comp: 'دوري السلة الأمريكي' },
  { date: '2026-11-22T13:00:00Z', home: 'Barcelona', away: 'Villarreal', comp: 'الدوري الإسباني' },
  { date: '2026-11-24T00:00:00Z', home: 'Philadelphia 76ers', away: 'Portland Trail Blazers', comp: 'دوري السلة الأمريكي' },
  { date: '2026-11-29T15:15:00Z', home: 'Deportivo La Coruna', away: 'Barcelona', comp: 'الدوري الإسباني' },
];
const MY_TEAMS = /nassr|^(fc )?barcelona$|76ers/i;

/* ================= small helpers ================= */
const $ = id => document.getElementById(id);
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const ar = v => String(v).replace(/\d/g, d => AR_DIGITS[d]);
const pad = n => String(n).padStart(2, '0');
const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
const ON_TV = !!window.TVBridge || /\bTV\b|AFT|BRAVIA/i.test(navigator.userAgent);
if (ON_TV) document.documentElement.classList.add('tv');

/* Reading the web: on the TV the app fetches for the page; in a browser the page fetches directly. */
const pending = {};
let reqId = 0;
window.__tvDone = (id, ok, text) => {
  const p = pending[id]; if (!p) return;
  delete pending[id];
  if (!ok) { p.rej(new Error(text)); return; }
  try { p.res(JSON.parse(text)); } catch (e) { p.rej(e); }
};
function getJSON(url) {
  if (window.TVBridge && window.TVBridge.get) {
    return new Promise((res, rej) => {
      const id = 'r' + (++reqId);
      pending[id] = { res, rej };
      window.TVBridge.get(id, url);
      setTimeout(() => { if (pending[id]) { delete pending[id]; rej(new Error('timeout')); } }, 30000);
    });
  }
  return fetch(url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
function tvLog(message) { try { if (window.TVBridge && window.TVBridge.log) window.TVBridge.log(String(message)); } catch (e) {} }

/* City clock: shift "now" by the city offset and read the UTC fields. */
function cityNow() { return new Date(Date.now() + CITY.tz * 3600e3); }
function cityParts(d) {
  return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), dow: d.getUTCDay(), h: d.getUTCHours(), min: d.getUTCMinutes() };
}
function clock12(hoursFloat) {
  let total = Math.round(hoursFloat * 60);
  total = ((total % 1440) + 1440) % 1440;
  const h = Math.floor(total / 60), m = total % 60;
  return { text: ar((h % 12) || 12) + ':' + ar(pad(m)), ampm: h < 12 ? 'ص' : 'م' };
}

/* ================= prayer times (Umm al-Qura method) ================= */
const RAD = Math.PI / 180;
const dsin = d => Math.sin(d * RAD), dcos = d => Math.cos(d * RAD), dtan = d => Math.tan(d * RAD);
const dasin = x => Math.asin(x) / RAD, dacos = x => Math.acos(Math.max(-1, Math.min(1, x))) / RAD;
const dacot = x => Math.atan(1 / x) / RAD, datan2 = (y, x) => Math.atan2(y, x) / RAD;
const wrap = (a, m) => ((a % m) + m) % m;

function julian(y, m, d) {
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
}
function sunPosition(jd) {
  const D = jd - 2451545.0;
  const g = wrap(357.529 + 0.98560028 * D, 360);
  const q = wrap(280.459 + 0.98564736 * D, 360);
  const L = wrap(q + 1.915 * dsin(g) + 0.020 * dsin(2 * g), 360);
  const e = 23.439 - 0.00000036 * D;
  const RA = wrap(datan2(dcos(e) * dsin(L), dcos(L)) / 15, 24);
  return { decl: dasin(dsin(e) * dsin(L)), eqt: q / 15 - RA };
}
function isRamadan(y, m, d) {
  try {
    const f = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { month: 'numeric', timeZone: 'UTC' });
    return f.format(new Date(Date.UTC(y, m - 1, d))).replace(/\D/g, '') === '9';
  } catch (e) { return false; }
}
/* Returns hours after local midnight for each prayer. */
function prayerTimes(y, m, d) {
  const { lat, lng, tz } = CITY;
  const jd0 = julian(y, m, d) - lng / (15 * 24);
  const at = t => sunPosition(jd0 + t / 24);
  const noon = t => wrap(12 - at(t).eqt, 24);
  const angle = (deg, t, dir) => {
    const dec = at(t).decl;
    return noon(t) + dir * dacos((-dsin(deg) - dsin(dec) * dsin(lat)) / (dcos(dec) * dcos(lat))) / 15;
  };
  const asr = t => angle(-dacot(1 + dtan(Math.abs(lat - at(t).decl))), t, 1);
  let t = { fajr: 5, sunrise: 6, dhuhr: 12, asr: 13, maghrib: 18 };
  for (let i = 0; i < 2; i++) {
    t = {
      fajr: angle(18.5, t.fajr / 24, -1),
      sunrise: angle(0.833, t.sunrise / 24, -1),
      dhuhr: noon(t.dhuhr / 24),
      asr: asr(t.asr / 24),
      maghrib: angle(0.833, t.maghrib / 24, 1),
    };
  }
  const shift = tz - lng / 15;
  const out = {};
  for (const k in t) out[k] = t[k] + shift;
  out.isha = out.maghrib + (isRamadan(y, m, d) ? 120 : 90) / 60;
  return out;
}
const PRAYERS = [['fajr', 'الفجر'], ['sunrise', 'الشروق'], ['dhuhr', 'الظهر'], ['asr', 'العصر'], ['maghrib', 'المغرب'], ['isha', 'العشاء']];

function renderPrayers() {
  const now = cityNow(), p = cityParts(now);
  const nowH = p.h + p.min / 60 + now.getUTCSeconds() / 3600;
  const today = prayerTimes(p.y, p.m, p.d);
  const salah = PRAYERS.filter(x => x[0] !== 'sunrise');

  let next = salah.find(([k]) => today[k] > nowH);
  let nextH, nextName;
  if (next) { nextH = today[next[0]]; nextName = next[1]; }
  else {
    const tm = cityParts(new Date(now.getTime() + 86400e3));
    nextH = prayerTimes(tm.y, tm.m, tm.d).fajr + 24; nextName = 'الفجر';
  }
  /* "It is time" for 15 minutes after each call to prayer. */
  const current = salah.filter(([k]) => today[k] <= nowH && nowH - today[k] < 0.25).pop();

  $('prayers').innerHTML = PRAYERS.map(([k, name]) => {
    const c = clock12(today[k]);
    const cls = (next && next[0] === k) ? 'upnext' : (today[k] <= nowH ? 'past' : '');
    return `<div class="prayer ${cls}"><span class="name">${name}</span><span class="at">${c.text} ${c.ampm}</span></div>`;
  }).join('');

  const box = $('next');
  if (current) {
    box.classList.add('now');
    $('nextText').innerHTML = `حان الآن وقت صلاة <b>${current[1]}</b>`;
  } else {
    box.classList.remove('now');
    const mins = Math.max(1, Math.round((nextH - nowH) * 60));
    const h = Math.floor(mins / 60), m = mins % 60;
    const left = h ? `${ar(h)} س ${ar(pad(m))} د` : `${ar(m)} د`;
    $('nextText').innerHTML = `الصلاة القادمة <b>${nextName}</b> بعد ${left}`;
  }
}

/* ================= clock and date ================= */
function renderClock() {
  const p = cityParts(cityNow());
  $('hh').textContent = ar((p.h % 12) || 12);
  $('mm').textContent = ar(pad(p.min));
  $('ampm').textContent = p.h < 12 ? 'ص' : 'م';
  $('dayName').textContent = DAYS[p.dow];
  $('fullDate').textContent = `${ar(p.d)} ${MONTHS[p.m - 1]} ${ar(p.y)}`;
}

/* ================= weather ================= */
const WX = [
  [[0], 'صافٍ', 'clear'], [[1], 'صافٍ غالبًا', 'clear'], [[2], 'غائم جزئيًّا', 'partly'], [[3], 'غائم', 'cloud'],
  [[45, 48], 'ضباب', 'fog'], [[51, 53, 55, 56, 57], 'رذاذ', 'rain'], [[61, 63, 65, 66, 67], 'مطر', 'rain'],
  [[71, 73, 75, 77, 85, 86], 'ثلج', 'cloud'], [[80, 81, 82], 'زخات مطر', 'rain'], [[95, 96, 99], 'عواصف رعدية', 'storm'],
];
function wxIcon(kind, night) {
  const s = 'fill="none" stroke="#f7f2e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"';
  const sun = night
    ? '<path d="M52 20a22 22 0 1 0 14 38A26 26 0 0 1 52 20z" fill="#f6b756"/>'
    : '<circle cx="42" cy="42" r="15" fill="#f6b756"/><g stroke="#f6b756" stroke-width="4" stroke-linecap="round"><path d="M42 12v8M42 64v8M12 42h8M64 42h8M21 21l6 6M57 57l6 6M21 63l6-6M57 27l6-6"/></g>';
  const cloud = `<path d="M26 62h34a12 12 0 0 0 1-24 17 17 0 0 0-32-3 13.5 13.5 0 0 0-3 27z" ${s} fill="rgba(247,242,232,.18)"/>`;
  const smallSun = night ? '<path d="M60 12a13 13 0 1 0 9 22 15 15 0 0 1-9-22z" fill="#f6b756"/>' : '<circle cx="60" cy="24" r="11" fill="#f6b756"/>';
  const body = {
    clear: sun,
    partly: smallSun + cloud,
    cloud: cloud,
    fog: cloud + `<path d="M20 72h44M28 80h28" ${s}/>`,
    rain: cloud + `<path d="M32 70l-3 8M44 70l-3 8M56 70l-3 8" ${s}/>`,
    storm: cloud + '<path d="M46 64l-8 10h8l-4 9" fill="none" stroke="#f6b756" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>',
  }[kind] || cloud;
  return `<svg viewBox="0 0 84 84" aria-hidden="true">${body}</svg>`;
}
function renderWeather(w, example) {
  const row = WX.find(r => r[0].includes(w.code)) || WX[0];
  $('weather').innerHTML =
    wxIcon(row[2], !w.day) +
    `<div><div class="temp">${ar(Math.round(w.temp))}°</div></div>` +
    `<div><div class="cond">${row[1]}${example ? ' <span class="tag">مثال</span>' : ''}</div>` +
    `<div class="sub">${CITY.name} · العظمى ${ar(Math.round(w.hi))}° · الصغرى ${ar(Math.round(w.lo))}°</div></div>`;
}
async function loadWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CITY.lat}&longitude=${CITY.lng}` +

async function fetchLive() {
  const from = new Date(Date.now() - 86400e3);
  const all = [];
  const results = await Promise.allSettled(FOLLOW.map(async ([path, comp, re, days]) => {
    const to = new Date(Date.now() + days * 86400e3);
    const j = await getJSON(`https://site.api.espn.com/apis/site/v2/sports/${path}/scoreboard?dates=${ymd(from)}-${ymd(to)}&limit=200`);
    tvLog(`scores ${path}: ${(j.events || []).length} events`);
    for (const ev of (j.events || [])) {
      const c = ev.competitions && ev.competitions[0];
      if (!c || !c.competitors) continue;
      const home = c.competitors.find(t => t.homeAway === 'home'), away = c.competitors.find(t => t.homeAway === 'away');
      if (!home || !away) continue;
      const hn = home.team.displayName || home.team.name, an = away.team.displayName || away.team.name;
      if (!re.test(hn) && !re.test(an)) continue;
      const st = (ev.status && ev.status.type) || {};
      all.push({ date: ev.date, home: hn, away: an, comp, state: st.state, hs: home.score, as: away.score });
    }
  }));
  results.forEach((r, i) => { if (r.status === 'rejected') tvLog(`scores ${FOLLOW[i][0]} failed: ${r.reason && r.reason.message}`); });
  if (results.every(r => r.status === 'rejected')) throw new Error('no scores feed reachable');
  return all;
}
function renderMatches(list, saved) {
  const now = Date.now();
  const rows = list
    .map(m => ({ ...m, t: new Date(m.date).getTime() }))
    .filter(m => m.state === 'in' || m.t > now - 3 * 3600e3)
    .sort((a, b) => a.t - b.t)
    .slice(0, 4);
  const tag = $('matchTag');
  tag.hidden = !saved;
  tag.textContent = saved ? 'جدول محفوظ ' + ar(18) + ' نوفمبر' : '';
  if (!rows.length) { $('matchList').innerHTML = '<p class="empty">لا توجد مباريات لفرقك خلال الأسبوعين القادمين.</p>'; return; }
  const today = cityParts(cityNow());
  $('matchList').innerHTML = rows.map(m => {
    const local = new Date(m.t + CITY.tz * 3600e3), p = cityParts(local);
    const dayDiff = Math.round((Date.UTC(p.y, p.m - 1, p.d) - Date.UTC(today.y, today.m - 1, today.d)) / 86400e3);
    const dayText = dayDiff === 0 ? 'اليوم' : dayDiff === 1 ? 'غدًا' : dayDiff < 7 && dayDiff > 0 ? DAYS[p.dow] : `${DAYS[p.dow]} ${ar(p.d)} ${MONTHS[p.m - 1]}`;
    const c = clock12(p.h + p.min / 60);
    const name = n => MY_TEAMS.test(n) ? `<b>${teamAr(n)}</b>` : teamAr(n);
    const live = m.state === 'in';
    const score = (live || m.state === 'post') && m.hs != null ? ` <span dir="ltr">${ar(m.hs)} - ${ar(m.as)}</span>` : '';
    return `<div class="match"><div><div class="teams">${name(m.home)} × ${name(m.away)}${score}</div><div class="comp">${m.comp}</div></div>` +
      `<div class="when">${live ? '<span class="livepill">جارية الآن</span>' : `<div class="d">${dayText}</div><div class="t">${c.text} ${c.ampm}</div>`}</div></div>`;
  }).join('');
}

  catch (e) { renderMatches(SAVED_MATCHES, true); }
}

const W = 1920, H = 1080;
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function noise1(seed) {
  const r = rng(seed), g = Array.from({ length: 512 }, r);
  return x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return g[i & 511] + (g[(i + 1) & 511] - g[i & 511]) * u; };
}
function fbm(n, x, oct) { let s = 0, a = 0.5, f = 1, norm = 0; for (let i = 0; i < oct; i++) { s += a * n(x * f); norm += a; a *= 0.5; f *= 2; } return s / norm; }

function sky(c, stops, toY) {
  const g = c.createLinearGradient(0, 0, 0, toY);
  stops.forEach(([p, col]) => g.addColorStop(p, col));
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}
function glow(c, x, y, r, col, core) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
  if (core) { c.fillStyle = core[1]; c.beginPath(); c.arc(x, y, core[0], 0, 7); c.fill(); }
}
function stars(c, seed, n, maxY) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const y = r() * maxY, a = (0.25 + r() * 0.75) * (1 - y / maxY * 0.7);
    c.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`;
    c.beginPath(); c.arc(r() * W, y, 0.6 + r() * 1.5, 0, 7); c.fill();
  }
}
/* One ridge line filled down to the bottom of the picture. Returns its outline points. */
function ridge(c, o) {
  const n = noise1(o.seed), pts = [];
  let top = H;
  for (let x = -20; x <= W + 20; x += 4) {
    let v = fbm(n, x / o.scale + 7.3, o.oct || 4);
    if (o.ridged) v = 1 - Math.abs(2 * v - 1);
    const y = o.base - o.amp * v;
    if (y < top) top = y;
    pts.push([x, y]);
  }
  const path = () => { c.beginPath(); c.moveTo(-20, H); pts.forEach(p => c.lineTo(p[0], p[1])); c.lineTo(W + 20, H); c.closePath(); };
  const g = c.createLinearGradient(0, top, 0, o.to || H);
  g.addColorStop(0, o.fill[0]); g.addColorStop(1, o.fill[1]);
  path(); c.fillStyle = g; c.fill();
  if (o.trees) {
    const r = rng(o.seed + 99);
    c.fillStyle = o.fill[0];
    for (let i = 0; i < pts.length; i += 2 + Math.floor(r() * 3)) {
      const [x, y] = pts[i], h = o.trees * (0.55 + r() * 0.75), w = h * 0.26;
      c.beginPath(); c.moveTo(x - w, y + 3); c.lineTo(x, y - h); c.lineTo(x + w, y + 3); c.closePath(); c.fill();
    }
  }
  if (o.snow) {
    c.save(); path(); c.clip();
    const s = c.createLinearGradient(0, top, 0, top + o.amp * o.snow);
    s.addColorStop(0, 'rgba(255,255,255,.95)'); s.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = s; c.fillRect(0, top, W, o.amp * o.snow); c.restore();
  }
  return pts;
}
function mist(c, y, h, col) {
  const g = c.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.5, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, y, W, h);
}
function water(c, y0, cols, seed, light) {
  const g = c.createLinearGradient(0, y0, 0, H);
  g.addColorStop(0, cols[0]); g.addColorStop(1, cols[1]);
  c.fillStyle = g; c.fillRect(0, y0, W, H - y0);
  const r = rng(seed);
  for (let i = 0; i < 520; i++) {
    const t = Math.pow(r(), 1.5), y = y0 + 4 + t * (H - y0), w = 30 + t * 260 * r();
    c.fillStyle = `rgba(255,255,255,${(0.03 + 0.07 * r()).toFixed(3)})`;
    c.fillRect(r() * W - w / 2, y, w, 1.2 + t * 3);
  }
  if (light) {
    for (let i = 0; i < 300; i++) {
      const t = Math.pow(r(), 1.3), y = y0 + 2 + t * (H - y0), w = 16 + t * 190 * r();
      const x = light.x + (r() - 0.5) * (50 + t * 620);
      c.fillStyle = light.col.replace('A', ((0.75 - 0.55 * t) * (0.35 + r() * 0.65)).toFixed(2));
      c.fillRect(x - w / 2, y, w, 1.5 + t * 3.5);
    }
  }
}
function clouds(c, seed, n, yMin, yMax, col) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const cx = r() * W, cy = yMin + r() * (yMax - yMin), puffs = 5 + Math.floor(r() * 5), size = 60 + r() * 90;
    for (let k = 0; k < puffs; k++) {
      const x = cx + (k - puffs / 2) * size * 0.75 + r() * 30, y = cy + (r() - 0.5) * size * 0.35, rad = size * (0.7 + r() * 0.6);
      const g = c.createRadialGradient(x, y, 0, x, y, rad);
      g.addColorStop(0, col); g.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = g; c.fillRect(x - rad, y - rad * 0.6, rad * 2, rad * 1.2);
    }
  }
}
function aurora(c, seed) {
  const r = rng(seed), n = noise1(seed + 5);
  c.save(); c.globalCompositeOperation = 'lighter';
  for (let band = 0; band < 3; band++) {
    const y0 = 150 + band * 90, hue = band === 1 ? '120,255,200' : '90,255,160';
    for (let x = 0; x < W; x += 6) {
      const v = fbm(n, x / 260 + band * 11, 3), top = y0 + (v - 0.5) * 260, h = 180 + v * 300;
      const a = Math.max(0, v - 0.32) * 0.22;
      const g = c.createLinearGradient(0, top, 0, top + h);
      g.addColorStop(0, `rgba(${hue},0)`); g.addColorStop(0.35, `rgba(${hue},${a.toFixed(3)})`); g.addColorStop(1, `rgba(${hue},0)`);
      c.fillStyle = g; c.fillRect(x, top, 6, h);
    }
  }
  c.restore(); r();
}

  const padX = ON_TV ? 0 : 32, padY = ON_TV ? 0 : 32 + (short ? 0 : $('helper').offsetHeight + 14);
  const s = Math.min((innerWidth - padX) / W, (innerHeight - padY) / H);
  $('stage').style.transform = `scale(${s})`;
  $('frame').style.width = W * s + 'px';
  $('frame').style.height = H * s + 'px';
}

/* ================= start ================= */
renderApps();
renderClock();
renderPrayers();
showScene(sceneForNow(), true);
fit();
addEventListener('resize', fit);
loadWeather();
loadMatches();
setInterval(renderClock, 1000);
setInterval(renderPrayers, 10e3);
setInterval(loadWeather, 30 * 60e3);
setInterval(loadMatches, 15 * 60e3);
setInterval(() => showScene(sceneIndex + 1), SCENE_MINUTES * 60e3);
$('nextScene').addEventListener('click', () => showScene(sceneIndex + 1));
/* Called by the TV app each time the home screen comes back to the front. */
let lastRefresh = Date.now();
window.__tvResume = () => {
  fit(); renderClock(); renderPrayers();
  if (Date.now() - lastRefresh > 5 * 60e3) { lastRefresh = Date.now(); loadWeather(); loadMatches(); }
};
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
</script>
</body>
