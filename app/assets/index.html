<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة التلفزيون الرئيسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: a fixed 1920x1080 TV stage scaled to fit. No boxes: white type in three strengths
     sits directly on a slow, soft background. Clock and prayers on the right, weather and matches
     on the left, a single dock of app tiles along the bottom. */
  color-scheme: dark;
  --ink: #ffffff;
  --ink-2: rgba(255, 255, 255, .62);
  --ink-3: rgba(255, 255, 255, .36);
  --hairline: rgba(255, 255, 255, .16);
  --tile: rgba(255, 255, 255, .13);
  --base: #07090f;
  --live: #ff453a;
  --font: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--base); color: var(--ink); font-family: var(--font); font-weight: 400;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 16px; overflow: hidden;
}
html.tv body { padding: 0; gap: 0; }

.frame { position: relative; overflow: hidden; border-radius: 12px; direction: ltr; flex: none; }
html.tv .frame { border-radius: 0; }
.stage {
  position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
  transform-origin: 0 0; direction: rtl; overflow: hidden; background: var(--base);
  text-shadow: 0 1px 18px rgba(0, 0, 0, .38);
}

/* ---------- background: soft colour fields, with photographs over them when available ---------- */
.fields { position: absolute; inset: -20%; }
.fields i { position: absolute; border-radius: 50%; will-change: transform; }
.fields i:nth-child(1) { width: 62%; height: 78%; left: 2%; top: 4%; background: radial-gradient(closest-side, rgba(56, 88, 190, .62), rgba(56, 88, 190, 0)); animation: floatA 46s ease-in-out infinite alternate; }
.fields i:nth-child(2) { width: 58%; height: 74%; right: 0; top: 18%; background: radial-gradient(closest-side, rgba(28, 132, 150, .50), rgba(28, 132, 150, 0)); animation: floatB 58s ease-in-out infinite alternate; }
.fields i:nth-child(3) { width: 54%; height: 70%; left: 26%; bottom: 0; background: radial-gradient(closest-side, rgba(112, 66, 170, .46), rgba(112, 66, 170, 0)); animation: floatC 52s ease-in-out infinite alternate; }
@keyframes floatA { to { transform: translate(14%, 10%) scale(1.15); } }
@keyframes floatB { to { transform: translate(-16%, -8%) scale(1.1); } }
@keyframes floatC { to { transform: translate(8%, -14%) scale(1.2); } }

.photos { position: absolute; inset: 0; animation: drift 70s ease-in-out infinite alternate; will-change: transform; }
.photos img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 3.2s ease; }
.photos img.on { opacity: 1; }
@keyframes drift {
  from { transform: scale(1.04) translate(0.8%, 0.5%); }
  to   { transform: scale(1.12) translate(-1.4%, -1%); }
}
.shade {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(to bottom, rgba(4, 6, 12, .46) 0, rgba(4, 6, 12, 0) 30%),
    linear-gradient(to left, rgba(4, 6, 12, .58) 0, rgba(4, 6, 12, 0) 42%),
    linear-gradient(to right, rgba(4, 6, 12, .50) 0, rgba(4, 6, 12, 0) 40%),
    linear-gradient(to top, rgba(4, 6, 12, .74) 0, rgba(4, 6, 12, 0) 34%),
    rgba(4, 6, 12, .20);
}
.stage.plain .shade { background: linear-gradient(to top, rgba(4, 6, 12, .45) 0, rgba(4, 6, 12, 0) 34%); }

/* ---------- right column: date, clock, prayers ---------- */
.now { position: absolute; top: 60px; right: 112px; width: 620px; }
.date { font-size: 34px; font-weight: 300; color: var(--ink-2); }
.clock { display: flex; align-items: baseline; gap: 20px; direction: ltr; justify-content: flex-end; margin-top: 2px; }
.clock .time { font-weight: 200; font-size: 236px; line-height: 1.08; font-variant-numeric: tabular-nums; letter-spacing: -3px; }
.clock .ampm { font-weight: 300; font-size: 54px; color: var(--ink-2); }
/* ---------- glass cards: a softened copy of the background sits inside each card ---------- */
.glass {
  position: absolute; left: var(--x); top: var(--y); border-radius: 40px; overflow: hidden; text-shadow: none;
  background: rgba(20, 22, 30, .34); box-shadow: 0 26px 60px rgba(0, 0, 0, .26);
  --ink-2: rgba(255, 255, 255, .76); --ink-3: rgba(255, 255, 255, .52); --hairline: rgba(255, 255, 255, .20);
}
.glass .back { position: absolute; left: calc(-1 * var(--x)); top: calc(-1 * var(--y)); width: 1920px; height: 1080px; animation: drift 70s ease-in-out infinite alternate; will-change: transform; }
.glass .back canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 3.2s ease; }
.glass .back canvas.on { opacity: 1; }
.glass::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(165deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .02) 45%, rgba(8, 10, 18, .10)), rgba(14, 16, 24, .40); }
.glass::after { content: ""; position: absolute; inset: 0; z-index: 3; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18), inset 0 1.5px 0 rgba(255, 255, 255, .42); }
.glass .inside { position: relative; z-index: 2; padding: 28px 36px 30px; }

.next { font-size: 30px; font-weight: 500; }
.next span { color: var(--ink-2); font-weight: 300; }
.prayers { margin-top: 16px; border-top: 1px solid var(--hairline); padding-top: 16px; display: grid; gap: 9px; }
.prayer { display: flex; justify-content: space-between; align-items: baseline; font-size: 26px; font-weight: 400; color: var(--ink-2); }
.prayer .at { font-variant-numeric: tabular-nums; }
.prayer.past { color: var(--ink-3); }
.prayer.upnext { color: var(--ink); font-weight: 500; }

/* ---------- left column: weather, matches ---------- */
.weather { display: flex; align-items: center; gap: 22px; }
.glass.slim { border-radius: 34px; }
.glass.slim .inside { padding: 18px 34px 20px; }
.weather svg { width: 56px; height: 56px; flex: none; }
.weather .temp { font-weight: 200; font-size: 64px; line-height: 1; }
.weather .cond { font-size: 28px; font-weight: 400; }
.weather .sub { font-size: 22px; font-weight: 300; color: var(--ink-2); margin-top: 2px; }
.label { font-size: 21px; font-weight: 400; color: var(--ink-3); display: flex; gap: 14px; align-items: center; }
.match { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 15px 0; border-top: 1px solid var(--hairline); }
.match:first-of-type { margin-top: 14px; }
.match .teams { font-size: 27px; font-weight: 400; line-height: 1.35; }
.match .teams .mine { font-weight: 500; }
.match .teams .other { color: var(--ink-2); font-weight: 400; }
.match .comp { font-size: 20px; font-weight: 400; color: var(--ink-3); margin-top: 1px; }
.match .when { text-align: left; flex: none; font-variant-numeric: tabular-nums; }
.match .when .d { font-size: 20px; font-weight: 400; color: var(--ink-2); }
.match .when .t { font-size: 25px; font-weight: 400; color: var(--ink); }
.match .when .live { color: var(--live); font-size: 22px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.match .when .live::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--live); }
.empty { font-size: 24px; font-weight: 300; color: var(--ink-2); padding: 18px 0; border-top: 1px solid var(--hairline); margin-top: 14px; }
.note { font-size: 18px; font-weight: 300; color: var(--ink-3); }

/* ---------- continue watching (only on the TV, only when apps have shared something) ---------- */
.continue { position: absolute; left: 96px; top: 706px; width: 1260px; }
.continue .label { color: var(--ink-2); margin-bottom: 10px; }
.continue .row { display: flex; gap: 18px; }
.cw {
  width: 222px; flex: none; border: 0; padding: 0; background: none; color: var(--ink); font-family: var(--font); cursor: pointer; text-align: right;
  transition: transform .2s ease;
}
.cw .art { position: relative; width: 222px; height: 125px; border-radius: 14px; overflow: hidden; background: var(--tile); transition: box-shadow .2s ease; }
.cw .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cw .art .bar { position: absolute; left: 10px; right: 10px; bottom: 8px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .32); overflow: hidden; direction: ltr; }
.cw .art .bar i { display: block; height: 100%; background: #fff; border-radius: 2px; }
.cw .name { font-size: 19px; font-weight: 400; margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cw:focus-visible { outline: none; transform: scale(1.08); z-index: 2; }
.cw:focus-visible .art { box-shadow: 0 0 0 3px rgba(255, 255, 255, .95), 0 18px 40px rgba(0, 0, 0, .55); }

/* ---------- dock ---------- */
.apps { position: absolute; bottom: 78px; left: 0; right: 0; display: flex; justify-content: center; gap: 18px; padding: 0 60px; }
.app {
  width: 142px; height: 80px; flex: none; border: 0; border-radius: 16px; overflow: hidden; cursor: pointer;
  background: var(--tile); color: var(--ink); font-family: var(--font); font-size: 19px; font-weight: 400;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0;
  transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
}
.app img.banner { width: 100%; height: 100%; object-fit: cover; display: block; }
.app img.icon { width: 46px; height: 46px; border-radius: 11px; }
.app svg { width: 30px; height: 30px; }
.app:hover { background: rgba(255, 255, 255, .22); }
.app:focus-visible { outline: none; transform: scale(1.16); box-shadow: 0 0 0 3px rgba(255, 255, 255, .95), 0 22px 46px rgba(0, 0, 0, .55); z-index: 2; }
.credit { position: absolute; bottom: 26px; left: 112px; font-size: 15px; font-weight: 300; color: var(--ink-3); direction: ltr; text-shadow: none; }

.toast {
  position: absolute; bottom: 196px; left: 50%; transform: translateX(-50%); background: rgba(20, 22, 30, .9);
  border-radius: 999px; padding: 14px 32px; font-size: 24px; font-weight: 300; opacity: 0; transition: opacity .3s; pointer-events: none; text-shadow: none;
}
.toast.show { opacity: 1; }

/* ---------- preview note (hidden on the TV) ---------- */
.helper { max-width: 620px; text-align: center; font-size: 14px; line-height: 1.8; color: var(--ink-2); font-weight: 300; }
html.tv .helper, html.short .helper { display: none; }

@media (prefers-reduced-motion: reduce) {
  .photos, .fields i, .glass .back { animation: none; }
  .photos img, .glass .back canvas { transition: none; }
}
</style>
</head>
<body>

<div class="frame" id="frame">
  <div class="stage plain" id="stage">
    <div class="fields" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="photos" aria-hidden="true"><img id="phA" alt=""><img id="phB" alt=""></div>
    <div class="shade" aria-hidden="true"></div>

    <div class="now">
      <div class="date" id="fullDate"></div>
      <div class="clock">
        <span class="ampm" id="ampm"></span>
        <span class="time"><span id="hh"></span>:<span id="mm"></span></span>
      </div>
    </div>

    <section class="glass" style="--x: 1408px; --y: 404px; width: 400px;" aria-label="أوقات الصلاة في الرياض">
      <div class="back" aria-hidden="true"><canvas width="192" height="108"></canvas><canvas width="192" height="108"></canvas></div>
      <div class="inside">
        <div class="next" id="nextText"></div>
        <div class="prayers" id="prayers"></div>
      </div>
    </section>

    <div class="glass slim" style="--x: 96px; --y: 70px;">
      <div class="back" aria-hidden="true"><canvas width="192" height="108"></canvas><canvas width="192" height="108"></canvas></div>
      <div class="inside"><div class="weather" id="weather"></div></div>
    </div>

    <section class="glass" style="--x: 96px; --y: 208px; width: 660px;" aria-label="مباريات فرقي">
      <div class="back" aria-hidden="true"><canvas width="192" height="108"></canvas><canvas width="192" height="108"></canvas></div>
      <div class="inside">
        <div class="label">مباريات فرقي <span class="note" id="matchTag" hidden></span></div>
        <div id="matchList"></div>
      </div>
    </section>

    <section class="continue" id="continue" aria-label="متابعة المشاهدة" hidden>
      <div class="label">متابعة المشاهدة</div>
      <div class="row" id="continueRow"></div>
    </section>

    <nav class="apps" id="apps" aria-label="التطبيقات"></nav>
    <div class="credit" id="credit"></div>
    <div class="toast" id="toast" role="status"></div>
  </div>
</div>

<p class="helper" id="helper">معاينة بمقاس شاشة التلفزيون. أدر الجوال أفقيًّا لتكبيرها. الصور الطبيعية وشعارات التطبيقات تظهر على التلفزيون فقط، وهنا تظهر خلفية لونية هادئة وأسماء التطبيقات.</p>

<script>
'use strict';

/* ================= settings ================= */
const CITY = { name: 'الرياض', lat: 24.7136, lng: 46.6753, tz: 3 };
const PHOTO_MINUTES = 5;
/* Dock tiles, right to left: [name, what to open, glyph for tiles that have no app artwork] */
const APPS = [
  ['نتفليكس', 'com.netflix.ninja'],
  ['يوتيوب', 'com.google.android.youtube.tv'],
  ['ثمانية', 'com.thmanyah.shasha.tv'],
  ['بي إن', 'hdmi:2', 'dish'],
  ['بلايستيشن', 'hdmi:3', 'pad'],
  ['ديزني+', 'com.disney.disneyplus'],
  ['أو إس إن+', 'com.osn.go'],
  ['آبل تي في', 'com.apple.atve.androidtv.appletv'],
  ['برايم فيديو', 'com.amazon.amazonvideo.livingroom'],
  ['إن بي إيه', 'com.nbaimd.gametime.nba2011'],
  ['كل التطبيقات', 'all', 'grid'],
];
/* Teams followed: [league path on the scores feed, competition name, team-name test] */
const FOLLOW = [
  ['soccer/ksa.1', 'دوري روشن', /nassr/i],
  ['soccer/esp.1', 'الدوري الإسباني', /^(fc )?barcelona$/i],
  ['basketball/nba', 'دوري السلة الأمريكي', /76ers/i],
];
/* Fixtures saved on 18 Nov 2026, used when the live feed gives nothing. */
const SAVED_MATCHES = [
  { date: '2026-11-19T00:00:00Z', home: 'Orlando Magic', away: 'Philadelphia 76ers', comp: 'دوري السلة الأمريكي' },
  { date: '2026-11-21T18:00:00Z', home: 'Philadelphia 76ers', away: 'Milwaukee Bucks', comp: 'دوري السلة الأمريكي' },
  { date: '2026-11-22T13:00:00Z', home: 'Barcelona', away: 'Villarreal', comp: 'الدوري الإسباني' },
  { date: '2026-11-24T00:00:00Z', home: 'Philadelphia 76ers', away: 'Portland Trail Blazers', comp: 'دوري السلة الأمريكي' },
  { date: '2026-11-25T22:00:00Z', home: 'Philadelphia 76ers', away: 'Miami Heat', comp: 'دوري السلة الأمريكي' },
  { date: '2026-11-29T15:15:00Z', home: 'Deportivo La Coruna', away: 'Barcelona', comp: 'الدوري الإسباني' },
  { date: '2026-12-02T20:30:00Z', home: 'Barcelona', away: 'Atletico Madrid', comp: 'الدوري الإسباني' },
];
const MY_TEAMS = /nassr|^(fc )?barcelona$|76ers/i;
/* Photographs: featured landscape pictures on Wikimedia Commons. */
const PHOTO_FEED = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*' +
  '&generator=categorymembers&gcmtitle=' + encodeURIComponent('Category:Featured pictures of landscapes') +
  '&gcmtype=file&gcmlimit=60&gcmsort=timestamp&gcmdir=desc' +
  '&prop=imageinfo&iiprop=url%7Csize%7Cmime%7Cextmetadata&iiurlwidth=1920&iiextmetadatafilter=Artist%7CLicenseShortName';

/* ================= small helpers ================= */
const $ = id => document.getElementById(id);
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const ar = v => String(v).replace(/\d/g, d => AR_DIGITS[d]);
const pad = n => String(n).padStart(2, '0');
const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
const ON_TV = !!window.TVBridge || /\bTV\b|AFT|BRAVIA/i.test(navigator.userAgent);
if (ON_TV) document.documentElement.classList.add('tv');

/* Reading the web: on the TV the app fetches for the page; in a browser the page fetches directly. */
const pending = {};
let reqId = 0;
window.__tvDone = (id, ok, text) => {
  const p = pending[id]; if (!p) return;
  delete pending[id];
  if (!ok) { p.rej(new Error(text)); return; }
  try { p.res(JSON.parse(text)); } catch (e) { p.rej(e); }
};
function getJSON(url) {
  if (window.TVBridge && window.TVBridge.get) {
    return new Promise((res, rej) => {
      const id = 'r' + (++reqId);
      pending[id] = { res, rej };
      window.TVBridge.get(id, url);
      setTimeout(() => { if (pending[id]) { delete pending[id]; rej(new Error('timeout')); } }, 30000);
    });
  }
  return fetch(url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
function tvLog(message) { try { if (window.TVBridge && window.TVBridge.log) window.TVBridge.log(String(message)); } catch (e) {} }

/* City clock: shift "now" by the city offset and read the UTC fields. */
function cityNow() { return new Date(Date.now() + CITY.tz * 3600e3); }
function cityParts(d) {
  return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), dow: d.getUTCDay(), h: d.getUTCHours(), min: d.getUTCMinutes() };
}
function clock12(hoursFloat) {
  let total = Math.round(hoursFloat * 60);
  total = ((total % 1440) + 1440) % 1440;
  const h = Math.floor(total / 60), m = total % 60;
  return { text: ar((h % 12) || 12) + ':' + ar(pad(m)), ampm: h < 12 ? 'ص' : 'م' };
}

/* ================= prayer times (Umm al-Qura method) ================= */
const RAD = Math.PI / 180;
const dsin = d => Math.sin(d * RAD), dcos = d => Math.cos(d * RAD), dtan = d => Math.tan(d * RAD);
const dasin = x => Math.asin(x) / RAD, dacos = x => Math.acos(Math.max(-1, Math.min(1, x))) / RAD;
const dacot = x => Math.atan(1 / x) / RAD, datan2 = (y, x) => Math.atan2(y, x) / RAD;
const wrap = (a, m) => ((a % m) + m) % m;

function julian(y, m, d) {
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
}
function sunPosition(jd) {
  const D = jd - 2451545.0;
  const g = wrap(357.529 + 0.98560028 * D, 360);
  const q = wrap(280.459 + 0.98564736 * D, 360);
  const L = wrap(q + 1.915 * dsin(g) + 0.020 * dsin(2 * g), 360);
  const e = 23.439 - 0.00000036 * D;
  const RA = wrap(datan2(dcos(e) * dsin(L), dcos(L)) / 15, 24);
  return { decl: dasin(dsin(e) * dsin(L)), eqt: q / 15 - RA };
}
function isRamadan(y, m, d) {
  try {
    const f = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { month: 'numeric', timeZone: 'UTC' });
    return f.format(new Date(Date.UTC(y, m - 1, d))).replace(/\D/g, '') === '9';
  } catch (e) { return false; }
}
/* Returns hours after local midnight for each prayer. */
function prayerTimes(y, m, d) {
  const { lat, lng, tz } = CITY;
  const jd0 = julian(y, m, d) - lng / (15 * 24);
  const at = t => sunPosition(jd0 + t / 24);
  const noon = t => wrap(12 - at(t).eqt, 24);
  const angle = (deg, t, dir) => {
    const dec = at(t).decl;
    return noon(t) + dir * dacos((-dsin(deg) - dsin(dec) * dsin(lat)) / (dcos(dec) * dcos(lat))) / 15;
  };
  const asr = t => angle(-dacot(1 + dtan(Math.abs(lat - at(t).decl))), t, 1);
  let t = { fajr: 5, sunrise: 6, dhuhr: 12, asr: 13, maghrib: 18 };
  for (let i = 0; i < 2; i++) {
    t = {
      fajr: angle(18.5, t.fajr / 24, -1),
      sunrise: angle(0.833, t.sunrise / 24, -1),
      dhuhr: noon(t.dhuhr / 24),
      asr: asr(t.asr / 24),
      maghrib: angle(0.833, t.maghrib / 24, 1),
    };
  }
  const shift = tz - lng / 15;
  const out = {};
  for (const k in t) out[k] = t[k] + shift;
  out.isha = out.maghrib + (isRamadan(y, m, d) ? 120 : 90) / 60;
  return out;
}
const PRAYERS = [['fajr', 'الفجر'], ['sunrise', 'الشروق'], ['dhuhr', 'الظهر'], ['asr', 'العصر'], ['maghrib', 'المغرب'], ['isha', 'العشاء']];

function renderPrayers() {
  const now = cityNow(), p = cityParts(now);
  const nowH = p.h + p.min / 60 + now.getUTCSeconds() / 3600;
  const today = prayerTimes(p.y, p.m, p.d);
  const salah = PRAYERS.filter(x => x[0] !== 'sunrise');

  const next = salah.find(([k]) => today[k] > nowH);
  let nextH, nextName;
  if (next) { nextH = today[next[0]]; nextName = next[1]; }
  else {
    const tm = cityParts(new Date(now.getTime() + 86400e3));
    nextH = prayerTimes(tm.y, tm.m, tm.d).fajr + 24; nextName = 'الفجر';
  }
  /* "It is time" for 15 minutes after each call to prayer. */
  const current = salah.filter(([k]) => today[k] <= nowH && nowH - today[k] < 0.25).pop();

  $('prayers').innerHTML = PRAYERS.map(([k, name]) => {
    const c = clock12(today[k]);

    return `<div class="prayer ${cls}"><span>${name}</span><span class="at">${c.text} ${c.ampm}</span></div>`;
  }).join('');

}

function readEvents(j, comp, re, into) {
  for (const ev of (j.events || [])) {
    const c = ev.competitions && ev.competitions[0];
    if (!c || !c.competitors) continue;
    const home = c.competitors.find(t => t.homeAway === 'home'), away = c.competitors.find(t => t.homeAway === 'away');
    if (!home || !away || !home.team || !away.team) continue;
    const hn = home.team.displayName || home.team.name || '', an = away.team.displayName || away.team.name || '';
    if (!re.test(hn) && !re.test(an)) continue;
    const st = (c.status && c.status.type) || (ev.status && ev.status.type) || {};
    const sc = s => (s && typeof s === 'object') ? (s.displayValue != null ? s.displayValue : s.value) : s;
    into.push({ date: ev.date || c.date, home: hn, away: an, comp, state: st.state, hs: sc(home.score), as: sc(away.score) });
  }
}
/* Each team's fixture list is read at most every six hours; today's scoreboard adds live scores. */
const schedules = {};
async function fetchLive() {
  const all = [];
  const results = await Promise.allSettled(FOLLOW.map(async ([path, comp, re]) => {
    const base = `https://site.api.espn.com/apis/site/v2/sports/${path}`;
    let got = 0, lastError = null;
    try { readEvents(await getJSON(base + '/scoreboard'), comp, re, all); got++; }
    catch (e) { lastError = e; tvLog(`scoreboard ${path} failed: ${e.message}`); }
    try {
      let c = schedules[path] || {};
      if (!c.events || Date.now() - c.at > 6 * 3600e3) {
        if (!c.id) {
          const teams = await getJSON(base + '/teams?limit=100');
          const league = (((teams.sports || [])[0] || {}).leagues || [])[0];
          const hit = ((league && league.teams) || []).map(t => t.team).find(t => t && re.test(t.displayName || t.name || ''));
          if (!hit) throw new Error('team not found in the league list');
          c.id = hit.id;
        }
        const events = [];
        readEvents(await getJSON(`${base}/teams/${c.id}/schedule?fixture=true`), comp, re, events);
        c = schedules[path] = { id: c.id, at: Date.now(), events };
        tvLog(`schedule ${path} team ${c.id}: ${events.length} fixtures`);
      }
      all.push(...c.events); got++;
    } catch (e) { lastError = e; tvLog(`schedule ${path} failed: ${e.message}`); }
    if (!got) throw lastError || new Error('no answer');
  }));
  if (results.every(r => r.status === 'rejected')) throw new Error('no scores feed reachable');
  return all;
}
function upcoming(list) {
  const now = Date.now(), seen = new Set();
  return list
    .map(m => ({ ...m, t: new Date(m.date).getTime() }))
    .filter(m => !isNaN(m.t) && (m.state === 'in' || m.t > now - 3 * 3600e3))
    .filter(m => { const k = Math.round(m.t / 3600e3) + teamAr(m.home) + teamAr(m.away); if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => a.t - b.t);
}
function renderMatches(list, saved) {
  const rows = upcoming(list).slice(0, 3);
  const tag = $('matchTag');
  tag.hidden = !saved;
  tag.textContent = saved ? 'جدول محفوظ' : '';
  if (!rows.length) { $('matchList').innerHTML = '<p class="empty">لا توجد مباريات قريبة.</p>'; return; }
  const today = cityParts(cityNow());
  $('matchList').innerHTML = rows.map(m => {
    const local = new Date(m.t + CITY.tz * 3600e3), p = cityParts(local);
    const dayDiff = Math.round((Date.UTC(p.y, p.m - 1, p.d) - Date.UTC(today.y, today.m - 1, today.d)) / 86400e3);
    const dayText = dayDiff === 0 ? 'اليوم' : dayDiff === 1 ? 'غدًا' : dayDiff < 7 && dayDiff > 0 ? DAYS[p.dow] : `${DAYS[p.dow]} ${ar(p.d)} ${MONTHS[p.m - 1]}`;
    const c = clock12(p.h + p.min / 60);
    const name = n => `<span class="${MY_TEAMS.test(n) ? 'mine' : 'other'}">${teamAr(n)}</span>`;
    const live = m.state === 'in';
    const score = (live || m.state === 'post') && m.hs != null && m.hs !== '' ? ` <span dir="ltr">${ar(m.hs)} - ${ar(m.as)}</span>` : '';
    return `<div class="match"><div><div class="teams">${name(m.home)} <span class="other">×</span> ${name(m.away)}${score}</div><div class="comp">${m.comp}</div></div>` +
      `<div class="when">${live ? '<span class="live">مباشر</span>' : `<div class="d">${dayText}</div><div class="t">${c.text} ${c.ampm}</div>`}</div></div>`;
  }).join('');
}

/* Rows read right to left, so the left arrow moves to the next item. Up and down change rows. */
document.addEventListener('keydown', e => {
  if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
  const rows = [[...document.querySelectorAll('#continueRow .cw')], [...document.querySelectorAll('#apps .app')]].filter(r => r.length);
  if (!rows.length) return;
  let ri = rows.findIndex(r => r.includes(document.activeElement));
  e.preventDefault();
  if (ri < 0) { rows[rows.length - 1][0].focus(); return; }
  const row = rows[ri], i = row.indexOf(document.activeElement);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    row[Math.max(0, Math.min(row.length - 1, i + (e.key === 'ArrowLeft' ? 1 : -1)))].focus();
    return;
  }
  const target = rows[ri + (e.key === 'ArrowDown' ? 1 : -1)];
  if (!target) return;
  const mid = el => { const b = el.getBoundingClientRect(); return b.left + b.width / 2; };
  const x = mid(document.activeElement);
  target.reduce((best, el) => Math.abs(mid(el) - x) < Math.abs(mid(best) - x) ? el : best, target[0]).focus();
});

let photos = [], photoIndex = -1, frontPhoto = 'phA';
const plain = s => String(s || '').replace(/<[^>]*>/g, '').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
async function loadPhotos() {
  try {
    const j = await getJSON(PHOTO_FEED);
    const pages = Object.values((j.query && j.query.pages) || {});
    const picks = [];
    for (const pg of pages) {
      const ii = pg.imageinfo && pg.imageinfo[0];
      if (!ii || !ii.thumburl || ii.mime !== 'image/jpeg') continue;
      const ratio = ii.width / ii.height;
      if (ii.width < 2400 || ratio < 1.35 || ratio > 2.0) continue;
      const meta = ii.extmetadata || {};
      picks.push({ src: ii.thumburl, by: plain(meta.Artist && meta.Artist.value).slice(0, 60), lic: plain(meta.LicenseShortName && meta.LicenseShortName.value) });
    }
    tvLog(`photos: ${pages.length} listed, ${picks.length} usable`);
    for (let i = picks.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [picks[i], picks[k]] = [picks[k], picks[i]]; }
    photos = picks;
    if (photos.length && photoIndex < 0) nextPhoto();
  } catch (e) { tvLog('photos failed: ' + e.message); }
}
/* Paints a small, softened copy of the photo; stretched over the stage it reads as frosted glass. */
function paintGlass(img) {
  document.querySelectorAll('.glass .back').forEach(back => {
    const [a, b] = back.querySelectorAll('canvas');
    const front = a.classList.contains('on') ? a : b, next = front === a ? b : a;
    const c = next.getContext('2d'), cw = next.width, ch = next.height;
    const ir = img.naturalWidth / img.naturalHeight, cr = cw / ch;
    let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
    if (ir > cr) { sw = sh * cr; sx = (img.naturalWidth - sw) / 2; } else { sh = sw / cr; sy = (img.naturalHeight - sh) / 2; }
    try { c.filter = 'blur(2px) saturate(1.35)'; } catch (e) {}
    c.clearRect(0, 0, cw, ch);
    c.drawImage(img, sx, sy, sw, sh, -4, -4, cw + 8, ch + 8);
    front.classList.remove('on'); next.classList.add('on');
  });
}
function nextPhoto(tries) {
  if (!photos.length) return;
  photoIndex = (photoIndex + 1) % photos.length;
  const p = photos[photoIndex];
  const back = frontPhoto === 'phA' ? 'phB' : 'phA', img = $(back);
  img.onload = () => {
    $(frontPhoto).classList.remove('on'); img.classList.add('on'); frontPhoto = back;
    try { paintGlass(img); } catch (e) { tvLog('glass: ' + e.message); }
    $('stage').classList.remove('plain');
    $('credit').textContent = p.by ? `Photo: ${p.by}${p.lic ? ' · ' + p.lic : ''} · Wikimedia Commons` : 'Wikimedia Commons';
  };
  img.onerror = () => { tvLog('photo did not load: ' + p.src); if ((tries || 0) < 3) nextPhoto((tries || 0) + 1); };
  img.src = p.src;
}

  const padX = ON_TV ? 0 : 32, padY = ON_TV ? 0 : 32 + (short ? 0 : $('helper').offsetHeight + 14);

  $('stage').style.transform = `scale(${s})`;

}

setInterval(renderClock, 1000);
setInterval(renderPrayers, 10e3);
setInterval(loadWeather, 30 * 60e3);
setInterval(loadMatches, 15 * 60e3);
setInterval(nextPhoto, PHOTO_MINUTES * 60e3);
setInterval(loadPhotos, 12 * 3600e3);
/* Called by the TV app each time the home screen comes back to the front. */
let lastRefresh = Date.now();
window.__tvResume = () => {
  fit(); renderClock(); renderPrayers(); loadContinue();
  if (Date.now() - lastRefresh > 5 * 60e3) { lastRefresh = Date.now(); loadWeather(); loadMatches(); if (!photos.length) loadPhotos(); }
};
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
</script>
