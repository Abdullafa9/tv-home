<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة التلفزيون الرئيسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: a fixed 1920x1080 TV stage scaled to fit. White type in three strengths.
     Right column: date, clock, prayers. Left column: a stack of glass cards (weather, sports, modes).
     Bottom: "continue watching" and one dock of app tiles. Everything is reachable with a remote. */
  color-scheme: dark;
  --ink: #ffffff;
  --ink-2: rgba(255, 255, 255, .78);
  --ink-3: rgba(255, 255, 255, .54);
  --hairline: rgba(255, 255, 255, .20);
  --tile: rgba(255, 255, 255, .14);
  --base: #07090f;
  --live: #ff453a;
  --tint: .52;            /* how dark the glass cards are; set from the settings */
  --fz: 1;                /* text scale inside the cards; set from the settings */
  --font: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--base); color: var(--ink); font-family: var(--font); font-weight: 400;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 16px; overflow: hidden;
}
html.tv body { padding: 0; gap: 0; }
button { font-family: var(--font); color: inherit; }

.frame { position: relative; overflow: hidden; border-radius: 12px; direction: ltr; flex: none; }
html.tv .frame { border-radius: 0; }
.stage {
  position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
  transform-origin: 0 0; direction: rtl; overflow: hidden; background: var(--base);
}

/* ---------- background ---------- */
.fields { position: absolute; inset: -20%; }
.fields i { position: absolute; border-radius: 50%; will-change: transform; }
.fields i:nth-child(1) { width: 62%; height: 78%; left: 2%; top: 4%; background: radial-gradient(closest-side, rgba(56, 88, 190, .62), rgba(56, 88, 190, 0)); animation: floatA 46s ease-in-out infinite alternate; }
.fields i:nth-child(2) { width: 58%; height: 74%; right: 0; top: 18%; background: radial-gradient(closest-side, rgba(28, 132, 150, .50), rgba(28, 132, 150, 0)); animation: floatB 58s ease-in-out infinite alternate; }
.fields i:nth-child(3) { width: 54%; height: 70%; left: 26%; bottom: 0; background: radial-gradient(closest-side, rgba(112, 66, 170, .46), rgba(112, 66, 170, 0)); animation: floatC 52s ease-in-out infinite alternate; }
@keyframes floatA { to { transform: translate(14%, 10%) scale(1.15); } }
@keyframes floatB { to { transform: translate(-16%, -8%) scale(1.1); } }
@keyframes floatC { to { transform: translate(8%, -14%) scale(1.2); } }
.photos { position: absolute; inset: 0; animation: drift 70s ease-in-out infinite alternate; will-change: transform; }
.photos img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 3.2s ease; }
.photos img.on { opacity: 1; }
@keyframes drift {
  from { transform: scale(1.04) translate(0.8%, 0.5%); }
  to   { transform: scale(1.12) translate(-1.4%, -1%); }
}
.shade {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(to bottom, rgba(4, 6, 12, .50) 0, rgba(4, 6, 12, 0) 30%),
    linear-gradient(to left, rgba(4, 6, 12, .55) 0, rgba(4, 6, 12, 0) 40%),
    linear-gradient(to top, rgba(4, 6, 12, .78) 0, rgba(4, 6, 12, 0) 36%),
    rgba(4, 6, 12, .16);
}
.stage.plain .shade { background: linear-gradient(to top, rgba(4, 6, 12, .45) 0, rgba(4, 6, 12, 0) 34%); }
/* Night mode: one veil over everything. */
.dim { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 90; transition: opacity 2s ease; }

/* ---------- glass cards: a softened copy of the background sits inside each card ---------- */
.glass { position: relative; border-radius: 38px; overflow: hidden; background: rgba(14, 16, 24, .30); box-shadow: 0 24px 56px rgba(0, 0, 0, .28); }
.glass .back { position: absolute; left: calc(-1 * var(--x, 0px)); top: calc(-1 * var(--y, 0px)); width: 1920px; height: 1080px; animation: drift 70s ease-in-out infinite alternate; will-change: transform; }
.glass .back canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 3.2s ease; }
.glass .back canvas.on { opacity: 1; }
.glass::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(165deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .02) 45%, rgba(8, 10, 18, .08)), rgba(10, 12, 20, var(--tint)); }
.glass::after { content: ""; position: absolute; inset: 0; z-index: 3; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16), inset 0 1.5px 0 rgba(255, 255, 255, .36); transition: box-shadow .18s ease; }
.glass .inside { position: relative; z-index: 2; padding: 24px 34px 26px; }
.label { font-size: calc(23px * var(--fz)); font-weight: 400; color: var(--ink-3); }
.note { font-size: calc(20px * var(--fz)); font-weight: 400; color: var(--ink-3); }

/* ---------- focus: one look everywhere ---------- */
.f { outline: none; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
.glass.f:focus::after { box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .95), inset 0 1.5px 0 rgba(255, 255, 255, .36); }
.glass.f:focus { transform: scale(1.015); }

/* ---------- right column: date, clock, prayers ---------- */
.col-r { position: absolute; top: 50px; right: 96px; width: 470px; text-shadow: 0 1px 18px rgba(0, 0, 0, .40); }
.date { font-size: 36px; font-weight: 300; color: var(--ink-2); }
.clock { display: flex; align-items: baseline; gap: 18px; direction: ltr; justify-content: flex-end; }
.clock .time { font-weight: 200; font-size: 218px; line-height: 1.08; font-variant-numeric: tabular-nums; letter-spacing: -3px; }
.clock .ampm { font-weight: 300; font-size: 52px; color: var(--ink-2); }
#cardPrayers { margin-top: 12px; text-shadow: none; }
.next { font-size: calc(31px * var(--fz)); font-weight: 500; line-height: 1.4; }
.next span { color: var(--ink-2); font-weight: 400; }
.prayers { margin-top: 14px; border-top: 1px solid var(--hairline); padding-top: 14px; display: grid; gap: 7px; }
.prayer { display: flex; justify-content: space-between; align-items: baseline; font-size: calc(30px * var(--fz)); font-weight: 400; color: var(--ink-2); line-height: 1.35; }
.prayer .at { font-variant-numeric: tabular-nums; }
.prayer.past { color: var(--ink-3); }
.prayer.upnext { color: var(--ink); font-weight: 600; }

/* ---------- left column: a stack of cards ---------- */
.col-l { position: absolute; top: 56px; left: 96px; width: 720px; display: flex; flex-direction: column; gap: 18px; }
.weather { display: flex; align-items: center; gap: 22px; }
.weather svg { width: 58px; height: 58px; flex: none; }
.weather .temp { font-weight: 200; font-size: calc(62px * var(--fz)); line-height: 1; }
.weather .cond { font-size: calc(30px * var(--fz)); font-weight: 400; }
.weather .sub { font-size: calc(24px * var(--fz)); font-weight: 400; color: var(--ink-2); margin-top: 2px; }
.glass.slim .inside { padding: 18px 34px 20px; }
.state { font-size: calc(27px * var(--fz)); color: var(--ink-2); padding: 10px 0 4px; line-height: 1.5; }

/* sports */
.sp-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.sp-head .right { display: flex; align-items: center; gap: 14px; }
.livetag { color: var(--live); font-size: calc(23px * var(--fz)); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.livetag::before { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--live); }
.dots { display: flex; gap: 8px; direction: ltr; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, .30); }
.dots i.on { background: #fff; }
.sp-main { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 14px; }
.team { display: flex; align-items: center; gap: 16px; flex: 1 1 0; min-width: 0; }
.team.away { flex-direction: row-reverse; text-align: left; }
.crest { width: 76px; height: 76px; flex: none; object-fit: contain; }
.crest.mono { border-radius: 50%; background: var(--tile); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 500; }
.team .tn { font-size: calc(34px * var(--fz)); font-weight: 500; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mid { flex: none; text-align: center; min-width: 110px; }
.mid .vs { font-size: 34px; color: var(--ink-3); font-weight: 300; }
.mid .score { display: flex; justify-content: center; gap: 14px; font-size: calc(56px * var(--fz)); font-weight: 300; line-height: 1.1; font-variant-numeric: tabular-nums; }
.mid .st { font-size: calc(22px * var(--fz)); color: var(--ink-2); margin-top: 2px; }
.sp-when { font-size: calc(28px * var(--fz)); margin-top: 12px; }
.sp-when span { color: var(--ink-2); }
.sp-watch { font-size: calc(24px * var(--fz)); color: var(--ink-2); margin-top: 2px; }
.sp-list { margin-top: 14px; border-top: 1px solid var(--hairline); padding-top: 10px; display: grid; gap: 4px; }
.sp-list div { display: flex; justify-content: space-between; gap: 18px; font-size: calc(25px * var(--fz)); color: var(--ink-2); line-height: 1.5; }
.sp-list .w { flex: none; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sp-list .n { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.f1-name { font-size: calc(34px * var(--fz)); font-weight: 500; margin-top: 12px; line-height: 1.3; }
.f1-rows { margin-top: 8px; display: grid; gap: 2px; }
.f1-rows div { display: flex; justify-content: space-between; font-size: calc(28px * var(--fz)); line-height: 1.5; }
.f1-rows div span:first-child { color: var(--ink-2); }
.hint { font-size: 19px; color: var(--ink-3); margin-top: 8px; display: none; }
#cardSports:focus .hint { display: block; }
.col-l.tight .sp-list, .col-l.tighter .sp-watch { display: none; }

/* modes */
.modes { display: flex; gap: 14px; }
.mode { flex: 1 1 0; min-width: 0; border: 0; border-radius: 20px; background: var(--tile); cursor: pointer; padding: 12px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.mode svg { width: 30px; height: 30px; }
.mode b { font-size: calc(26px * var(--fz)); font-weight: 500; }
.mode small { font-size: calc(19px * var(--fz)); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.mode:focus { background: rgba(255, 255, 255, .26); box-shadow: 0 0 0 3px rgba(255, 255, 255, .95); transform: scale(1.05); }

/* ---------- continue watching ---------- */
.continue { position: absolute; left: 96px; top: 712px; width: 1260px; text-shadow: 0 1px 14px rgba(0, 0, 0, .5); }
.continue .label { color: var(--ink-2); margin-bottom: 10px; }
.continue .row { display: flex; gap: 18px; }
.cw { width: 222px; flex: none; border: 0; padding: 0; background: none; cursor: pointer; text-align: right; }
.cw .art { position: relative; width: 222px; height: 125px; border-radius: 14px; overflow: hidden; background: var(--tile); transition: box-shadow .18s ease; }
.cw .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cw .art .bar { position: absolute; left: 10px; right: 10px; bottom: 8px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .32); overflow: hidden; direction: ltr; }
.cw .art .bar i { display: block; height: 100%; background: #fff; border-radius: 2px; }
.cw .name { font-size: 21px; margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cw:focus { transform: scale(1.08); z-index: 2; }
.cw:focus .art { box-shadow: 0 0 0 3px rgba(255, 255, 255, .95), 0 18px 40px rgba(0, 0, 0, .55); }

/* ---------- dock ---------- */
.apps { position: absolute; bottom: 66px; left: 0; right: 0; display: flex; justify-content: center; gap: 16px; padding: 0 70px; }
.app {
  width: 142px; height: 80px; flex: 0 1 142px; min-width: 0; border: 0; border-radius: 16px; overflow: hidden; cursor: pointer;
  background: var(--tile); font-size: 19px; font-weight: 400;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 0;
}
.app img.banner { width: 100%; height: 100%; object-fit: cover; display: block; }
.app img.icon { width: 44px; height: 44px; border-radius: 11px; object-fit: contain; }
.app svg { width: 30px; height: 30px; }
.app span { max-width: 92%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app:focus { transform: scale(1.16); box-shadow: 0 0 0 3px rgba(255, 255, 255, .95), 0 22px 46px rgba(0, 0, 0, .55); z-index: 2; background: rgba(255, 255, 255, .24); }
.credit { position: absolute; bottom: 22px; left: 96px; font-size: 15px; font-weight: 300; color: var(--ink-3); direction: ltr; }

/* ---------- idle: only the background and the clock stay ---------- */
.hideable { transition: opacity 1.4s ease; }
.stage.idle .hideable { opacity: 0; pointer-events: none; }

/* ---------- settings panel ---------- */
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .46); z-index: 40; }
.panel { position: absolute; top: 44px; bottom: 44px; left: 96px; width: 900px; z-index: 50; border-radius: 40px; background: rgba(15, 17, 25, .93); box-shadow: 0 30px 80px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .14); overflow: hidden; }
.pbody { height: 100%; overflow-y: auto; padding: 30px 40px 60px; scrollbar-width: none; scroll-padding: 110px 0; }
.pbody::-webkit-scrollbar { display: none; }
.ptop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.ptop h2 { font-size: 40px; font-weight: 500; }
.panel h3 { font-size: 23px; font-weight: 500; color: var(--ink-3); margin: 30px 0 8px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 10px 0; border-top: 1px solid rgba(255, 255, 255, .09); }
.row .rl { font-size: 27px; min-width: 0; }
.row .rl small { display: block; font-size: 20px; color: var(--ink-3); margin-top: 2px; line-height: 1.5; }
.row .rc { display: flex; gap: 10px; flex: none; align-items: center; }
.btn { border: 0; border-radius: 14px; background: var(--tile); min-height: 54px; padding: 0 22px; font-size: 24px; cursor: pointer; white-space: nowrap; }
.btn.on { background: rgba(255, 255, 255, .92); color: #10131c; font-weight: 500; }
.btn.sq { padding: 0; width: 54px; }
.btn .chev { color: var(--ink-3); margin-inline-start: 8px; }
.btn.on .chev { color: rgba(16, 19, 28, .5); }
.btn:focus { box-shadow: 0 0 0 3px rgba(255, 255, 255, .95); transform: scale(1.05); background: rgba(255, 255, 255, .28); }
.btn.on:focus { background: #fff; box-shadow: 0 0 0 3px #fff, 0 0 0 7px rgba(255, 255, 255, .35); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 0 6px; }
.info { font-size: 22px; color: var(--ink-2); line-height: 1.7; padding: 8px 0; }

.toast { position: absolute; bottom: 176px; left: 50%; transform: translateX(-50%); background: rgba(20, 22, 30, .94); border-radius: 999px; padding: 14px 32px; font-size: 24px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 80; }
.toast.show { opacity: 1; }

/* ---------- preview note (hidden on the TV) ---------- */
.helper { max-width: 640px; text-align: center; font-size: 14px; line-height: 1.8; color: var(--ink-2); font-weight: 300; }
html.tv .helper, html.short .helper { display: none; }

@media (prefers-reduced-motion: reduce) {
  .photos, .fields i, .glass .back { animation: none; }
  .photos img, .glass .back canvas, .hideable, .f { transition: none; }
}
</style>
</head>
<body>

<div class="frame" id="frame">
  <div class="stage plain" id="stage">
    <div class="fields" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="photos" aria-hidden="true"><img id="phA" alt=""><img id="phB" alt=""></div>
    <div class="shade" aria-hidden="true"></div>

    <div class="col-r">
      <div class="date" id="fullDate"></div>
      <div class="clock">
        <span class="ampm" id="ampm"></span>
        <span class="time"><span id="hh"></span>:<span id="mm"></span></span>
      </div>
      <section class="glass hideable" id="cardPrayers" aria-label="أوقات الصلاة في الرياض">
        <div class="back" aria-hidden="true"><canvas width="192" height="108"></canvas><canvas width="192" height="108"></canvas></div>
        <div class="inside">
          <div class="next" id="nextText"></div>
          <div class="prayers" id="prayers"></div>
        </div>
      </section>
    </div>

    <div class="col-l hideable" id="colL">
      <section class="glass slim" id="cardWeather" aria-label="الطقس">
        <div class="back" aria-hidden="true"><canvas width="192" height="108"></canvas><canvas width="192" height="108"></canvas></div>
        <div class="inside" id="weather"></div>
      </section>
      <section class="glass f" id="cardSports" tabindex="0" aria-label="الرياضة">
        <div class="back" aria-hidden="true"><canvas width="192" height="108"></canvas><canvas width="192" height="108"></canvas></div>
        <div class="inside" id="sports"></div>
      </section>
      <section class="glass slim" id="cardModes" aria-label="أوضاع الاستخدام">
        <div class="back" aria-hidden="true"><canvas width="192" height="108"></canvas><canvas width="192" height="108"></canvas></div>
        <div class="inside"><div class="modes" id="modes"></div></div>
      </section>
    </div>

    <section class="continue hideable" id="continue" aria-label="متابعة المشاهدة" hidden>
      <div class="label">متابعة المشاهدة</div>
      <div class="row" id="continueRow"></div>
    </section>

    <nav class="apps hideable" id="apps" aria-label="التطبيقات"></nav>
    <div class="credit hideable" id="credit"></div>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="panel" id="panel" aria-label="الإعدادات" hidden><div class="pbody" id="pbody"></div></aside>
    <div class="toast" id="toast" role="status"></div>
    <div class="dim" id="dim" aria-hidden="true"></div>
  </div>
</div>

<p class="helper" id="helper">معاينة بمقاس شاشة التلفزيون، وتعمل بأسهم لوحة المفاتيح وEnter وEsc. الصور الطبيعية والشعارات والبيانات المباشرة تظهر على التلفزيون؛ ما تراه هنا من مباريات وطقس عرض توضيحي فقط.</p>

<script>
'use strict';

/* =====================================================================
   1. Basics
   ===================================================================== */
const $ = id => document.getElementById(id);
const BR = window.TVBridge || null;
const ON_TV = !!BR || /\bTV\b|AFT|BRAVIA/i.test(navigator.userAgent);
if (ON_TV) document.documentElement.classList.add('tv');
const CITY = { name: 'الرياض', lat: 24.7136, lng: 46.6753, tz: 3 };
const W = 1920, H = 1080;

const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const ar = v => String(v).replace(/\d/g, d => AR_DIGITS[d]);
const pad = n => String(n).padStart(2, '0');
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
function tvLog(message) { try { if (BR && BR.log) BR.log(String(message)); } catch (e) {} }

/* City clock: shift "now" by the city offset and read the UTC fields. */
function cityParts(ms) {
  const d = new Date(ms + CITY.tz * 3600e3);
  return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), dow: d.getUTCDay(), h: d.getUTCHours(), min: d.getUTCMinutes(), s: d.getUTCSeconds() };
}
function clockText(h, m) { return ar((h % 12) || 12) + ':' + ar(pad(m)) + ' ' + (h < 12 ? 'ص' : 'م'); }
function timeAt(ms) { const p = cityParts(ms); return clockText(p.h, p.min); }
function dayAt(ms) {
  const p = cityParts(ms), t = cityParts(Date.now());
  const diff = Math.round((Date.UTC(p.y, p.m - 1, p.d) - Date.UTC(t.y, t.m - 1, t.d)) / 86400e3);
  if (diff === 0) return 'اليوم';
  if (diff === 1) return 'غدًا';
  if (diff === -1) return 'أمس';
  if (diff > 1 && diff < 7) return DAYS[p.dow];
  return `${DAYS[p.dow]} ${ar(p.d)} ${MONTHS[p.m - 1]}`;
}
/* Arabic counted nouns: 1, 2, 3-10 and 11+ each take a different form. */
function counted(n, one, two, few, many) {
  if (n === 1) return one;
  if (n === 2) return two;
  if (n >= 3 && n <= 10) return `${ar(n)} ${few}`;
  return `${ar(n)} ${many}`;
}
function untilText(ms) {
  const m = Math.max(1, Math.round(ms / 60000)), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  const parts = [];
  if (d) parts.push(counted(d, 'يوم', 'يومين', 'أيام', 'يومًا'));
  if (h) parts.push(counted(h, 'ساعة', 'ساعتين', 'ساعات', 'ساعة'));
  if (!d && mm) parts.push(counted(mm, 'دقيقة', 'دقيقتين', 'دقائق', 'دقيقة'));
  return 'بعد ' + parts.slice(0, 2).join(' و');
}

/* =====================================================================
   2. Saved settings and saved data
   ===================================================================== */
const store = {
  get(key) {

/* =====================================================================
   3. Clock and prayer times (Umm al-Qura method)
   ===================================================================== */
const RAD = Math.PI / 180;
const dsin = d => Math.sin(d * RAD), dcos = d => Math.cos(d * RAD), dtan = d => Math.tan(d * RAD);
const dasin = x => Math.asin(x) / RAD, dacos = x => Math.acos(Math.max(-1, Math.min(1, x))) / RAD;
const dacot = x => Math.atan(1 / x) / RAD, datan2 = (y, x) => Math.atan2(y, x) / RAD;
const wrap = (a, m) => ((a % m) + m) % m;
function julian(y, m, d) {
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
}
function sunPosition(jd) {
  const D = jd - 2451545.0;
  const g = wrap(357.529 + 0.98560028 * D, 360);
  const q = wrap(280.459 + 0.98564736 * D, 360);
  const L = wrap(q + 1.915 * dsin(g) + 0.020 * dsin(2 * g), 360);
  const e = 23.439 - 0.00000036 * D;
  const RA = wrap(datan2(dcos(e) * dsin(L), dcos(L)) / 15, 24);
  return { decl: dasin(dsin(e) * dsin(L)), eqt: q / 15 - RA };
}
function isRamadan(y, m, d) {
  try {
    const f = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { month: 'numeric', timeZone: 'UTC' });
    return f.format(new Date(Date.UTC(y, m - 1, d))).replace(/\D/g, '') === '9';
  } catch (e) { return false; }
}
/* Hours after local midnight for each prayer. */
function prayerTimes(y, m, d) {
  const { lat, lng, tz } = CITY;
  const jd0 = julian(y, m, d) - lng / (15 * 24);
  const at = t => sunPosition(jd0 + t / 24);
  const noon = t => wrap(12 - at(t).eqt, 24);
  const angle = (deg, t, dir) => {
    const dec = at(t).decl;
    return noon(t) + dir * dacos((-dsin(deg) - dsin(dec) * dsin(lat)) / (dcos(dec) * dcos(lat))) / 15;
  };
  const asr = t => angle(-dacot(1 + dtan(Math.abs(lat - at(t).decl))), t, 1);
  let t = { fajr: 5, sunrise: 6, dhuhr: 12, asr: 13, maghrib: 18 };
  for (let i = 0; i < 2; i++) {
    t = { fajr: angle(18.5, t.fajr / 24, -1), sunrise: angle(0.833, t.sunrise / 24, -1), dhuhr: noon(t.dhuhr / 24), asr: asr(t.asr / 24), maghrib: angle(0.833, t.maghrib / 24, 1) };
  }
  const shift = tz - lng / 15, out = {};
  for (const k in t) out[k] = t[k] + shift;
  out.isha = out.maghrib + (isRamadan(y, m, d) ? 120 : 90) / 60;
  return out;
}
const PRAYERS = [['fajr', 'الفجر'], ['sunrise', 'الشروق'], ['dhuhr', 'الظهر'], ['asr', 'العصر'], ['maghrib', 'المغرب'], ['isha', 'العشاء']];
function hoursText(h) { let t = Math.round(h * 60); t = ((t % 1440) + 1440) % 1440; return clockText(Math.floor(t / 60), t % 60); }
function renderPrayers() {
  const p = cityParts(Date.now()), nowH = p.h + p.min / 60 + p.s / 3600;
  const today = prayerTimes(p.y, p.m, p.d);
  const salah = PRAYERS.filter(x => x[0] !== 'sunrise');
  const next = salah.find(([k]) => today[k] > nowH);
  let nextH, nextName;
  if (next) { nextH = today[next[0]]; nextName = next[1]; }
  else { const tm = cityParts(Date.now() + 86400e3); nextH = prayerTimes(tm.y, tm.m, tm.d).fajr + 24; nextName = 'الفجر'; }
  const current = salah.filter(([k]) => today[k] <= nowH && nowH - today[k] < 0.25).pop();   /* 15 minutes after the call */
  $('prayers').innerHTML = PRAYERS.map(([k, name]) => {
    const cls = (next && next[0] === k) ? 'upnext' : (today[k] <= nowH ? 'past' : '');
    return `<div class="prayer ${cls}"><span>${name}</span><span class="at">${hoursText(today[k])}</span></div>`;
  }).join('');
  $('nextText').innerHTML = current ? `حان الآن وقت صلاة ${current[1]}` : `${nextName} <span>${untilText((nextH - nowH) * 3600e3)}</span>`;
}
function renderClock() {
  const p = cityParts(Date.now());
  $('hh').textContent = ar((p.h % 12) || 12);
  $('mm').textContent = ar(pad(p.min));
  $('ampm').textContent = p.h < 12 ? 'ص' : 'م';
  $('fullDate').textContent = `${DAYS[p.dow]} ${ar(p.d)} ${MONTHS[p.m - 1]}`;
}

const favKey = t => t.league + '#' + t.id;
const isFav = (league, id) => S.teams.some(t => t.league === league && String(t.id) === String(id));

function readEvents(j, league, into) {
  for (const ev of (j.events || [])) {
    const c = ev.competitions && ev.competitions[0];
    if (!c || !c.competitors) continue;
    const home = c.competitors.find(t => t.homeAway === 'home'), away = c.competitors.find(t => t.homeAway === 'away');
    if (!home || !away || !home.team || !away.team) continue;
    if (!isFav(league, home.team.id) && !isFav(league, away.team.id)) continue;
    const st = (c.status && c.status.type) || (ev.status && ev.status.type) || {};
    const score = s => (s && typeof s === 'object') ? (s.displayValue != null ? s.displayValue : s.value) : s;
    const side = t => ({ id: String(t.team.id || ''), name: t.team.displayName || t.team.name || '', logo: t.team.logo || (t.team.logos && t.team.logos[0] && t.team.logos[0].href) || '', score: score(t.score) });
    const t = new Date(ev.date || c.date).getTime();
    if (isNaN(t)) continue;
    into.push({ id: String(ev.id || (league + t)), league, t, state: st.state || 'pre', detail: st.shortDetail || st.detail || '', home: side(home), away: side(away) });
  }
}
function mergeRecords(fresh) {
  const byId = new Map(records.map(r => [r.id, r]));
  for (const r of fresh) {
    const old = byId.get(r.id);
    /* A scoreboard answer is newer than a fixture list: never let "not started" overwrite "live" or "finished". */
    if (old && (old.state === 'in' || old.state === 'post') && r.state === 'pre') continue;
    if (old) { r.home.logo = r.home.logo || old.home.logo || ''; r.away.logo = r.away.logo || old.away.logo || ''; }
    byId.set(r.id, r);
  }
  const now = Date.now();
  records = [...byId.values()].filter(r => r.t > now - 36 * 3600e3 && (isFav(r.league, r.home.id) || isFav(r.league, r.away.id))).sort((a, b) => a.t - b.t);
  remember('matches', records);
}
async function loadSchedules(force) {
  if (!S.teams.length) { mark('matches', true); renderSports(); return; }
  const results = await Promise.allSettled(S.teams.map(async team => {
    const k = favKey(team);
    if (!force && schedules[k] && Date.now() - schedules[k] < 6 * 3600e3) return;
    const got = [];
    readEvents(await getJSON(`https://site.api.espn.com/apis/site/v2/sports/${team.league}/teams/${team.id}/schedule?fixture=true`), team.league, got);
    schedules[k] = Date.now();
    tvLog(`fixtures ${k}: ${got.length}`);
    mergeRecords(got);
  }));
  const failed = results.filter(r => r.status === 'rejected');
  failed.forEach(r => tvLog('fixtures failed: ' + (r.reason && r.reason.message)));
  mark('matches', failed.length < results.length, failed[0] && failed[0].reason && failed[0].reason.message);
  renderSports();
}

/* What the card shows. Slides: the featured game, then the next race. */

const PHOTO_FEED = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*' +
  '&generator=categorymembers&gcmtitle=' + encodeURIComponent('Category:Featured pictures of landscapes') +
  '&gcmtype=file&gcmlimit=60&gcmsort=timestamp&gcmdir=desc' +

async function loadPhotos() {
  try {
    const j = await getJSON(PHOTO_FEED);
    const picks = [];
    for (const pg of Object.values((j.query && j.query.pages) || {})) {
      const ii = pg.imageinfo && pg.imageinfo[0];
      if (!ii || !ii.thumburl || ii.mime !== 'image/jpeg') continue;
      const ratio = ii.width / ii.height;
      if (ii.width < 2400 || ratio < 1.35 || ratio > 2.0) continue;
      const meta = ii.extmetadata || {};
      picks.push({ src: ii.thumburl, by: plain(meta.Artist && meta.Artist.value).slice(0, 60), lic: plain(meta.LicenseShortName && meta.LicenseShortName.value) });
    }
    for (let i = picks.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [picks[i], picks[k]] = [picks[k], picks[i]]; }
    if (!picks.length) throw new Error('no usable pictures in the list');

  } catch (e) { mark('photos', false, e.message); tvLog('photos failed: ' + e.message); }
  applyBackground();
}
/* Paints a small, softened copy of the photo into every card; stretched over the stage it reads as frosted glass. */
function paintGlass(img) {
  document.querySelectorAll('.glass .back').forEach(back => {
    const [a, b] = back.querySelectorAll('canvas');
    const front = a.classList.contains('on') ? a : b, next = front === a ? b : a;
    const c = next.getContext('2d'), cw = next.width, ch = next.height;
    c.clearRect(0, 0, cw, ch);
    if (img) {
      const ir = img.naturalWidth / img.naturalHeight, cr = cw / ch;
      let sw = img.naturalWidth, sh = img.naturalHeight, sx = 0, sy = 0;
      if (ir > cr) { sw = sh * cr; sx = (img.naturalWidth - sw) / 2; } else { sh = sw / cr; sy = (img.naturalHeight - sh) / 2; }
      try { c.filter = 'blur(2px) saturate(1.35)'; } catch (e) {}
      c.drawImage(img, sx, sy, sw, sh, -4, -4, cw + 8, ch + 8);
    }
    front.classList.remove('on');
    if (img) next.classList.add('on');
  });
}
function showPhoto(p, tries) {
  const back = frontPhoto === 'phA' ? 'phB' : 'phA', img = $(back);
  img.onload = () => {
    $(frontPhoto).classList.remove('on'); img.classList.add('on'); frontPhoto = back; currentPhoto = p;
    try { paintGlass(img); } catch (e) { tvLog('glass: ' + e.message); }
    $('stage').classList.remove('plain');
    $('credit').textContent = p.by ? `Photo: ${p.by}${p.lic ? ' · ' + p.lic : ''} · Wikimedia Commons` : 'Wikimedia Commons';
  };
  img.onerror = () => { tvLog('photo did not load: ' + p.src); if (S.bg.mode === 'photos' && (tries || 0) < 3) nextPhoto((tries || 0) + 1); };

}

  clearInterval(photoTimer);
  if (S.bg.mode === 'colors') {
    $('phA').classList.remove('on'); $('phB').classList.remove('on'); currentPhoto = null;
    paintGlass(null); $('stage').classList.add('plain'); $('credit').textContent = '';
    return;
  }
  if (S.bg.mode === 'fixed' && S.bg.fixed) { if (!currentPhoto || currentPhoto.src !== S.bg.fixed.src) showPhoto(S.bg.fixed, 0); return; }
  if (!currentPhoto) nextPhoto();

let scale = 1;

  scale = Math.min((innerWidth - padX) / W, (innerHeight - padY) / H);

    const r = g.getBoundingClientRect();
    g.style.setProperty('--x', ((r.left - sr.left) / scale).toFixed(1) + 'px');
    g.style.setProperty('--y', ((r.top - sr.top) / scale).toFixed(1) + 'px');

  if (col.scrollHeight > limit) col.classList.add('tighter');

}
let placeQueued = false;
function placeSoon() { if (placeQueued) return; placeQueued = true; requestAnimationFrame(() => { placeQueued = false; fitStack(); }); }

const CARD_EL = { weather: 'cardWeather', sports: 'cardSports', modes: 'cardModes', prayers: 'cardPrayers' };
function applySettings() {
  const root = document.documentElement.style;
  root.setProperty('--tint', [0.36, 0.52, 0.68][S.glass] || 0.52);
  root.setProperty('--fz', [1, 1.1, 1.2][S.font] || 1);
  for (const [name, id] of Object.entries(CARD_EL)) $(id).hidden = S.off.includes(name);
  S.stack.forEach((name, i) => { $(CARD_EL[name]).style.order = i; });

  renderApps(); renderModes(); renderSports(); renderWeather(); loadContinue(); applyNight(); placeSoon();
}

/* =====================================================================
   10. Night mode and idle
   ===================================================================== */
function isNight() {
  if (!S.night.on) return false;
  const h = cityParts(Date.now()).h, a = S.night.from, b = S.night.to;
  return a === b ? false : a < b ? (h >= a && h < b) : (h >= a || h < b);
}
function applyNight() { $('dim').style.opacity = isNight() ? ([0.22, 0.38, 0.54][S.night.level] || 0.38) : 0; }
let lastKey = Date.now(), idle = false, panelOpen = false;
function wake() { lastKey = Date.now(); if (idle) { idle = false; $('stage').classList.remove('idle'); } }
function idleTick() {
  if (idle || !S.idle || panelOpen) return;
  if (Date.now() - lastKey > S.idle * 60e3) { idle = true; $('stage').classList.add('idle'); }
}

/* =====================================================================
   11. Remote control: arrows, OK and Back
   ===================================================================== */
const visible = el => el.offsetParent !== null && !el.closest('[hidden]');
function focusables() { return [...(panelOpen ? $('panel') : $('stage')).querySelectorAll('.f')].filter(visible); }
function homeFocus() {
  const tiles = [...document.querySelectorAll('#apps .app')];
  return tiles.find(t => t.dataset.target === S.last) || tiles[0] || focusables()[0];
}
/* If the selection was lost (an item disappeared, a panel closed), put it back somewhere sensible. */
function ensureFocus() {
  const list = focusables();
  if (list.includes(document.activeElement)) return true;
  const el = panelOpen ? list[0] : homeFocus();
  if (el) el.focus({ preventScroll: !panelOpen });
  return false;
}
/* Moves to the nearest item in that direction; items in the same row or column are preferred. */
function move(dir) {
  if (!ensureFocus()) return;
  const cur = document.activeElement, a = cur.getBoundingClientRect();
  const horizontal = dir === 'left' || dir === 'right';
  let best = null, bestScore = Infinity;
  for (const el of focusables()) {
    if (el === cur) continue;
    const b = el.getBoundingClientRect();
    const dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
    if ((dir === 'left' && dx > -2) || (dir === 'right' && dx < 2) || (dir === 'up' && dy > -2) || (dir === 'down' && dy < 2)) continue;
    const gapX = Math.max(0, Math.max(a.left, b.left) - Math.min(a.right, b.right));
    const gapY = Math.max(0, Math.max(a.top, b.top) - Math.min(a.bottom, b.bottom));
    const along = horizontal ? gapX : gapY, across = horizontal ? gapY : gapX;
    const score = along + across * 4 + (horizontal ? Math.abs(dy) : Math.abs(dx)) * 0.15;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) { best.focus({ preventScroll: true }); if (panelOpen) best.scrollIntoView({ block: 'nearest' }); }
}
function goBack() {
  if (idle) { wake(); return true; }
  if (panelOpen) { closePanel(); return true; }
  return false;
}
window.__tvBack = () => { goBack(); };
document.addEventListener('keydown', e => {
  const k = e.key;
  if (idle) { wake(); e.preventDefault(); e.stopPropagation(); return; }   /* the first press only brings the screen back */
  lastKey = Date.now();
  const dir = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[k];
  if (dir) {
    e.preventDefault();
    const cur = document.activeElement;
    if (!panelOpen && cur && cur.id === 'cardSports' && (dir === 'left' || dir === 'right') && slides.length > 1) { turnSlide(dir === 'left' ? 1 : -1, true); return; }
    move(dir);
  } else if (k === 'Enter' || k === ' ') {
    if (!ensureFocus()) { e.preventDefault(); return; }
    const cur = document.activeElement;
    if (cur.tagName !== 'BUTTON') { e.preventDefault(); cur.click(); }
  } else if (k === 'Escape' || k === 'Backspace' || k === 'GoBack' || k === 'BrowserBack') {
    if (goBack()) e.preventDefault();
  }
}, true);
document.addEventListener('pointerdown', wake, true);
setInterval(() => { if (S.rotate && Date.now() > holdUntil && !panelOpen && !idle) turnSlide(1, false); }, 12e3);

/* =====================================================================
   12. Settings panel
   ===================================================================== */
const ui = { league: LEAGUES[0][0], teams: {}, teamState: {} };
let actions = {};
function btn(key, text, fn, cls) { actions[key] = fn; return `<button type="button" class="f btn ${cls || ''}" data-k="${esc(key)}">${text}</button>`; }
function row(label, controls, desc) { return `<div class="row"><div class="rl"><div>${label}</div>${desc ? `<small>${desc}</small>` : ''}</div><div class="rc">${controls}</div></div>`; }
function toggle(key, label, get, set, desc) { return row(label, btn(key, get() ? 'مفعّل' : 'متوقف', () => set(!get()), get() ? 'on' : ''), desc); }
function choice(key, label, options, get, set, desc) {
  const i = Math.max(0, options.findIndex(o => o[0] === get()));
  return row(label, btn(key, `${options[i][1]}<span class="chev">‹</span>`, () => set(options[(i + 1) % options.length][0])), desc);
}
function targetOptions() {
  return S.apps.filter(t => t !== 'all' && available(t)).map(t => [t, isInput(t) && !/^HDMI/.test(KNOWN[t] || 'HDMI') ? `${KNOWN[t]} (HDMI ${ar(t.slice(5))})` : esc(targetLabel(t))]);
}
function swap(list, i, j) { if (j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; }
async function loadLeagueTeams(path) {
  if (ui.teams[path] || ui.teamState[path] === 'loading') return;
  ui.teamState[path] = 'loading';
  try {
    const j = await getJSON(`https://site.api.espn.com/apis/site/v2/sports/${path}/teams?limit=100`);
    const league = (((j.sports || [])[0] || {}).leagues || [])[0];
    const list = ((league && league.teams) || []).map(t => t.team).filter(Boolean).map(t => ({ id: String(t.id), name: t.displayName || t.name || '' }));
    if (!list.length) throw new Error('empty list');
    ui.teams[path] = list; ui.teamState[path] = 'ok';
  } catch (e) { ui.teamState[path] = 'failed'; tvLog('team list failed for ' + path + ': ' + e.message); }
  if (panelOpen) renderPanel();
}
function healthLine(key, name) {
  const st = health[key];
  const text = !st ? 'لم يُطلب بعد' : st.ok ? `يعمل · آخر تحديث ${timeAt(st.at)}` : st.at ? `متعثّر · آخر تحديث ${dayAt(st.at)} ${timeAt(st.at)}` : 'متعثّر · لا توجد بيانات محفوظة';
  return `<div class="row"><div class="rl"><div>${name}</div><small>${text}</small></div></div>`;
}
function renderPanel() {
  const keep = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : '';
  const scrolled = $('pbody').scrollTop;
  actions = {};
  const h = [];
  h.push(`<div class="ptop"><h2>الإعدادات</h2>${btn('close', 'إغلاق', closePanel)}</div>`);

  h.push('<h3>الفرق والبطولات</h3>');

  const st = ui.teamState[ui.league];

      const on = isFav(ui.league, t.id);

        if (on) { S.teams = S.teams.filter(x => !(x.league === ui.league && String(x.id) === t.id)); mergeRecords([]); }
        else { S.teams.push({ league: ui.league, id: t.id, name: t.name }); loadSchedules(true).then(loadScores); }
      }, on ? 'on' : '');
    }).join('') + '</div>');
  } else h.push(`<div class="info">${st === 'failed' ? 'تعذّر تحميل فرق هذه البطولة الآن.' : 'جارٍ تحميل الفرق…'}</div>`);
  if (!st) loadLeagueTeams(ui.league);

  if (!sources.length) h.push('<div class="info">تظهر هنا البطولات بعد اختيار الفرق.</div>');

    h.push(row('الصورة الحالية', btn('bgnext', 'التالية', () => nextPhoto()) + btn('bgpin', 'تثبيتها', () => { if (currentPhoto) { S.bg.fixed = currentPhoto; S.bg.mode = 'fixed'; } })));
  }
  if (S.bg.mode === 'fixed') h.push(row('الصورة الثابتة', btn('bgother', 'صورة أخرى', () => { if (photos.length) { photoIndex = (photoIndex + 1) % photos.length; S.bg.fixed = photos[photoIndex]; } })));

  h.push('<h3>الوضع الليلي والخمول</h3>');
  const hours = list => list.map(x => [x, clockText(x, 0)]);
  h.push(toggle('night', 'الوضع الليلي التلقائي', () => S.night.on, v => { S.night.on = v; }, 'يخفّف سطوع الواجهة والخلفية معًا. التحكم بإضاءة الشاشة نفسها غير متاح للتطبيقات.'));
  if (S.night.on) {
    h.push(choice('nfrom', 'يبدأ', hours([19, 20, 21, 22, 23, 0, 1]), () => S.night.from, v => { S.night.from = v; }));
    h.push(choice('nto', 'ينتهي', hours([4, 5, 6, 7, 8, 9]), () => S.night.to, v => { S.night.to = v; }));
    h.push(choice('nlevel', 'قوة التخفيف', [[0, 'خفيفة'], [1, 'متوسطة'], [2, 'قوية']], () => S.night.level, v => { S.night.level = v; }));
  }
  h.push(toggle('awake', 'إبقاء الشاشة تعمل دائمًا', () => S.awake, v => { S.awake = v; }, 'يمنع انطفاء التلفزيون وشاشة التوقف ما دامت هذه الواجهة معروضة. داخل التطبيقات الأخرى يبقى سلوك التلفزيون كما هو.'));
  h.push(choice('idle', 'إخفاء البطاقات عند الخمول', [[0, 'متوقف'], [1, 'بعد دقيقة'], [3, 'بعد ٣ دقائق'], [5, 'بعد ٥ دقائق'], [10, 'بعد ١٠ دقائق'], [30, 'بعد ٣٠ دقيقة']], () => S.idle, v => { S.idle = v; },
    'تبقى الخلفية والساعة. أي ضغطة تعيد الواجهة دون أن تشغّل شيئًا.'));

  h.push('<h3>حالة البيانات</h3>');
  h.push(healthLine('weather', 'الطقس') + healthLine('matches', 'جداول المباريات') + healthLine('scores', 'النتائج المباشرة') + healthLine('f1', 'الفورمولا ١') + healthLine('photos', 'الصور الطبيعية'));

}
$('pbody').addEventListener('click', e => {
